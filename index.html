    const c = DB.memoData.countdowns.find(x => x.id === id);
    if (c) { c.title = title; c.startDate = countdownEntryDate; }
  } else {
    DB.memoData.countdowns.push({ id:uid('cd'), title, startDate:countdownEntryDate, fixed:false });
  }
  countdownEditingId = null; countdownTitleCache = '';
  saveDB(); closeModal(); renderPage('memo',''); showToast('已保存');

function deleteCountdown(id){

  if (c.fixed) { showToast('该纪念卡片永久保留，不可删除'); return; }
  showModal(`<div class="modal-title">删除确认</div>

/* 生活记事馆：模块切换 + 渲染分发 */
function changeLoveModuleDate(delta){ loveModuleDate = addDays(loveModuleDate, delta); renderPage('memo',''); }
function changeMemoNoteDate(delta){ memoNoteDate = addDays(memoNoteDate, delta); renderPage('memo',''); }
function changePasswordModuleDate(delta){ passwordModuleDate = addDays(passwordModuleDate, delta); renderPage('memo',''); }

function switchMemoModule(key){
  memoModule = key;
  renderPage('memo','');
}
function renderMemo(){
  let html = '';

  /* ① 计时卡片 */
  html += '<div class="section-header mt-8"><h3>⏱️ 计时卡片</h3><button class="btn btn-outline btn-sm" onclick="addCountdown(false)">＋ 新增</button></div>';
  const cds = DB.memoData.countdowns || [];
  if (!cds.length) {
    html += '<div class="empty-state"><span class="emoji">⏱️</span>还没有计时卡片，点右上角「＋ 新增」</div>';
  } else {
    html += '<div class="countdown-grid">';
    cds.forEach(c => {
      const d = c.startDate ? dateDiff(c.startDate, today()) : null;
      const past = d !== null && d > 0;
      const cls = 'countdown-card' + (c.fixed ? ' fixed' : '') + (past ? ' countdown-past' : '');
      let numHtml;
      if (d === null) numHtml = '未设置';
      else if (d === 0) numHtml = '就是今天';
      else if (d > 0) numHtml = '<span class="cd-pre">已经</span><b>' + d + '</b><span class="cd-suf">天</span>';
      else numHtml = '<span class="cd-pre">还有</span><b>' + Math.abs(d) + '</b><span class="cd-suf">天</span>';
      const acts = c.fixed
        ? '<span class="countdown-lock">🔒</span>'
        : '<button class="btn-icon btn-sm" onclick="deleteCountdown(\'' + c.id + '\')" title="删除">🗑</button>';
      html += '<div class="' + cls + '">'
        + '<div class="countdown-main">'
        + '<div class="countdown-title">' + escapeHTML(c.title) + '</div>'
        + '<div class="countdown-date">' + (c.startDate || '未设置日期') + '</div>'
        + '</div>'
        + '<div class="countdown-num">' + numHtml + '</div>'
        + '<div class="countdown-acts"><button class="btn-icon btn-sm" onclick="editCountdown(\'' + c.id + '\')" title="编辑">✏️</button>' + acts + '</div>'
        + '</div>';
    });
    html += '</div>';
  }

  /* 模块切换 Tab */
  html += '<div class="memo-tabbar mt-16">';
  MEMO_MODULES.forEach(m => {
    html += '<button class="memo-tab ' + (memoModule === m.key ? 'active' : '') + '" onclick="switchMemoModule(\'' + m.key + '\')">' + m.emoji + ' ' + m.name + '</button>';
  });
  html += '</div>';

  /* 当前模块内容 */
  if (memoModule === 'period') html += renderPeriodModule();
  else if (memoModule === 'love') html += renderLoveModule();
  else if (memoModule === 'memo') html += renderMemoNoteModule();
  else if (memoModule === 'password') html += renderPasswordModule();

  return html;
}

function renderPage(page, subpage) {
  curPage = page; curSub = subpage;
  const area = document.getElementById('contentArea');
  let html = '';
  try {
    if (page === 'home') html = renderHome();
    else if (page === 'todo') html = renderTodo();
    else if (page === 'english') html = renderEnglish(subpage);
    else if (page === 'fitness') html = renderFitness();
    else if (page === 'finance') html = renderFinance();
    else if (page === 'memo') html = renderMemo();
    else if (page === 'goal') html = renderGoal();
  } catch (e) {
    console.error('[renderPage] 渲染失败:', page, subpage, e);
    html = `<div class="card" style="padding:20px"><h3>页面加载出错</h3><p class="text-sm text-gray">请按 F12 打开控制台，把红色报错截图给开发者。</p><p class="text-sm text-gray">错误：${escapeHTML(e.message)}</p></div>`;
  }
  if (area) area.innerHTML = html;

  // 页面渲染后绑定事件
  try { afterRender(page, subpage); } catch (e) { console.error('[afterRender] 失败:', page, subpage, e); }
}

/* ========== 口语模块事件委托 ========== */
function bindSpeakingEvents() {
  // 使用事件委托处理发音按钮
  const card = document.getElementById('speakingDailyCard');
  if (card) {
    // 移除旧监听器（简单方式：clone）
    const newCard = card.cloneNode(true);
    card.parentNode.replaceChild(newCard, card);
    
    newCard.addEventListener('click', function(e) {
      const btn = e.target.closest('button');
      if (!btn) return;
      
      // 发音按钮
      if (btn.classList.contains('speak-btn')) {
        const text = btn.getAttribute('data-text');
        if (text) speakWord(decodeHTML(text));
      }
      // 录音按钮
      if (btn.classList.contains('rec-start-btn')) {
        const idx = parseInt(btn.getAttribute('data-idx'));
        const text = btn.getAttribute('data-text');
        startRecording(idx, decodeHTML(text));
      }
      // 停止按钮
      if (btn.classList.contains('rec-stop-btn')) {
        const idx = parseInt(btn.getAttribute('data-idx'));
        stopRecording(idx);
      }
    });
  }
}

function decodeHTML(str) {
  if (!str) return '';
  const txt = document.createElement('textarea');
  txt.innerHTML = str;
  return txt.value;
}/* ===== 视频画面 Canvas 绘制 ===== */
function drawFriendsCanvas() {
  const canvas = document.getElementById('friendsCanvas');
  if (!canvas) return;
  
  const fs = speakingState.friendsState;
  const season = FRIENDS_SCRIPTS[fs.season];
  if (!season) return;
  const episode = season.episodes[fs.episode];
  if (!episode) return;
  const line = episode.scenes[fs.currentLineIdx];
  if (!line) return;

  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width || 640;
  const h = rect.height || 360;
  canvas.width = w;
  canvas.height = h;
  
  const ctx = canvas.getContext('2d');
  
  // 根据剧集生成独特的背景色
  const seasonColors = [
    '#2d1b69','#1a3a5c','#2e4a2e','#5c2d2d','#4a2d5c',
    '#1a4a4a','#5c4a1a','#3d1a3d','#1a2d4a','#4a1a2d'
  ];
  const sIdx = parseInt(fs.season.replace('S','')) - 1;
  const baseColor = seasonColors[sIdx] || '#2d1b69';
  
  // 绘制渐变背景
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, baseColor);
  grad.addColorStop(0.5, adjustBrightness(baseColor, 0.7));
  grad.addColorStop(1, adjustBrightness(baseColor, 1.3));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  
  // 绘制中央咖啡馆场景元素
  drawCoffeeShopScene(ctx, w, h, fs, episode);
  
  // 绘制中央大字台词
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = `bold ${Math.min(28, w/18)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  
  const words = line.en.split(' ');
  const maxWidth = w * 0.8;
  const lines = wrapText(ctx, words.join(' '), maxWidth);
  
  // 半透明背景框
  const lineHeight = Math.min(40, w/14);
  const totalTextH = lines.length * lineHeight;
  const textY = h * 0.35;
  
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const boxPad = 20;
  const boxW = maxWidth + boxPad * 2;
  const boxH = totalTextH + boxPad * 2;
  const boxX = (w - boxW) / 2;
  const boxY = textY - boxPad;
  roundRect(ctx, boxX, boxY, boxW, boxH, 12);
  ctx.fill();
  
  // 绘制文字
  ctx.fillStyle = '#ffffff';
  lines.forEach((l, i) => {
    ctx.fillText(l, w/2, textY + i * lineHeight + lineHeight * 0.3);
  });
  
  // 绘制中央咖啡馆标志
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.font = `${Math.min(80, w/6)}px serif`;
  ctx.textAlign = 'center';
  ctx.fillText('☕', w * 0.15, h * 0.2);
}

function adjustBrightness(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const clamp = (v) => Math.min(255, Math.max(0, Math.round(v * factor)));
  return `rgb(${clamp(r)},${clamp(g)},${clamp(b)})`;
}

function drawCoffeeShopScene(ctx, w, h, fs, episode) {
  // 沙发轮廓
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  // 沙发靠背
  ctx.beginPath();
  ctx.moveTo(w*0.15, h*0.65);
  ctx.quadraticCurveTo(w*0.5, h*0.55, w*0.85, h*0.65);
  ctx.stroke();
  // 沙发坐垫
  ctx.beginPath();
  ctx.moveTo(w*0.12, h*0.72);
  ctx.quadraticCurveTo(w*0.5, h*0.65, w*0.88, h*0.72);
  ctx.lineTo(w*0.88, h*0.82);
  ctx.quadraticCurveTo(w*0.5, h*0.78, w*0.12, h*0.82);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fill();
  ctx.stroke();
  
  // 小圆桌
  ctx.beginPath();
  ctx.arc(w*0.5, h*0.78, w*0.04, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.stroke();
  
  // 咖啡杯
  ctx.beginPath();
  ctx.arc(w*0.35, h*0.75, w*0.015, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(w*0.65, h*0.75, w*0.015, 0, Math.PI*2);
  ctx.fill();
  
  // 装饰灯泡
  const bulbCount = 3;
  for (let i = 0; i < bulbCount; i++) {
    const bx = w * (0.25 + i * 0.25);
    const by = h * 0.12;
    ctx.beginPath();
    ctx.arc(bx, by, w*0.012, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,220,150,0.2)';
    ctx.fill();
    // 灯泡光晕
    const glow = ctx.createRadialGradient(bx, by, 0, bx, by, w*0.04);
    glow.addColorStop(0, 'rgba(255,220,150,0.15)');
    glow.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(bx, by, w*0.04, 0, Math.PI*2);
    ctx.fill();
  }
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let currentLine = '';
  for (const word of words) {
    const testLine = currentLine ? currentLine + ' ' + word : word;
    if (ctx.measureText(testLine).width > maxWidth && currentLine) {
      lines.push(currentLine);
      currentLine = word;
    } else {
      currentLine = testLine;
    }
  }
  if (currentLine) lines.push(currentLine);
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ========== 输入框自动持久化 ========== */
const FORM_CACHE_KEY = 'judy_form_cache';
let formCache = {};

// 加载缓存的表单数据
try {
  const raw = localStorage.getItem(FORM_CACHE_KEY);
  formCache = raw ? JSON.parse(raw) : {};
} catch(e) { formCache = {}; }

// 从缓存恢复所有输入框
function restoreFormCache() {
  document.querySelectorAll('input[type="text"], input[type="number"], input[type="date"], textarea').forEach(el => {
    const id = el.id;
    if (id && formCache[id] !== undefined) {
      el.value = formCache[id];
    }
  });
}

// 事件委托：所有 input/textarea 变更时实时缓存
document.addEventListener('input', function(e) {
  const el = e.target;
  if ((el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number' || el.type === 'date')) || el.tagName === 'TEXTAREA') {
    if (el.id) {
      formCache[el.id] = el.value;
      try { localStorage.setItem(FORM_CACHE_KEY, JSON.stringify(formCache)); } catch(e) {}
    }
  }
}, true);

// 每次渲染页面后恢复缓存
const _origRenderPage = renderPage;
renderPage = function(page, subpage) {
  _origRenderPage(page, subpage);
  setTimeout(restoreFormCache, 100);
};

// 关闭前确保数据保存
window.addEventListener('beforeunload', function() {
  saveDBNow();
  try { localStorage.setItem(FORM_CACHE_KEY, JSON.stringify(formCache)); } catch(e) {}
});

function exportAllData() {
  saveDB();
  try { localStorage.setItem(FORM_CACHE_KEY, JSON.stringify(formCache)); } catch(e) {}
  const exportData = {
    version: 1,
    exportedAt: new Date().toISOString(),
    db: DB,
    formCache: formCache
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'judy-life-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 数据已导出');
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.db) { showToast('❌ 无效的备份文件'); return; }
      DB = data.db;
      saveDB();
      if (data.formCache) {
        formCache = data.formCache;
        try { localStorage.setItem(FORM_CACHE_KEY, JSON.stringify(formCache)); } catch(e) {}
      }
      loadDB(); // 重新初始化默认结构
      restoreFormCache();
      renderPage('home','');
      showToast('✅ 数据已恢复，请刷新页面');
      setTimeout(() => location.reload(), 1500);
    } catch(err) {
      showToast('❌ 文件解析失败');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
