/* ===== 录音系统 (MediaRecorder API) ===== */
let mediaRecorder = null;
let audioChunks = [];
let currentRecordIdx = null;
let isPresentationRecord = false;

async function startRecording(idx, sentence) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast('❌ 浏览器不支持录音。Android 请用 Chrome 浏览器并允许麦克风权限');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!window.MediaRecorder) {
      showToast('❌ 浏览器不支持录音功能，请使用 Chrome/Edge 浏览器');
      stream.getTracks().forEach(t => t.stop());
      return;
    }
    // 检测最佳 MIME 类型（Android Chrome 支持 webm）
    let mimeType = '';
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', ''];
    for (const t of types) {
      if (t === '' || MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
    }
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    audioChunks = [];
    currentRecordIdx = idx;
    isPresentationRecord = false;

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blobType = mimeType || 'audio/webm';
      const blob = new Blob(audioChunks, { type: blobType });
      const url = URL.createObjectURL(blob);
      const playerId = 'audioPlayer'+idx;
      const player = document.getElementById(playerId);
      if (player) { player.src = url; player.style.display = 'block'; }
      stream.getTracks().forEach(t => t.stop());
    };
    // Android 上 MediaRecorder 可能触发错误
    mediaRecorder.onerror = (e) => {
      showToast('❌ 录音出错：' + (e.error || '未知错误'));
      stream.getTracks().forEach(t => t.stop());
      const recBtn = document.getElementById('recBtn'+idx);
      const stopBtn = document.getElementById('stopBtn'+idx);
      if (recBtn) recBtn.classList.remove('hidden');
      if (stopBtn) stopBtn.classList.add('hidden');
    };

    mediaRecorder.start();
    const recBtn = document.getElementById('recBtn'+idx);
    const stopBtn = document.getElementById('stopBtn'+idx);
    if (recBtn) recBtn.classList.add('hidden');
    if (stopBtn) stopBtn.classList.remove('hidden');
    showToast('🔴 正在录音...');
  } catch(e) {
    const errMsg = e.name === 'NotAllowedError' ? '麦克风权限被拒绝，请在浏览器设置中允许麦克风访问'
      : e.name === 'NotFoundError' ? '未检测到麦克风设备'
      : e.message;
    showToast('❌ ' + errMsg);
  }
}

function stopRecording(idx) {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    const sentence = currentRecordIdx !== null && speakingState.currentSentences ? speakingState.currentSentences[currentRecordIdx] : '';
    mediaRecorder.stop();
    const recBtn = document.getElementById('recBtn'+idx);
    const stopBtn = document.getElementById('stopBtn'+idx);
    if (recBtn) recBtn.classList.remove('hidden');
    if (stopBtn) stopBtn.classList.add('hidden');
    showToast('✅ 录音完成，正在分析发音...');
    // 延迟执行纠音分析（让用户看到回放音频先出现）
    setTimeout(() => {
      if (sentence) showCorrection(sentence);
    }, 500);
  }
}

/* ===== 智能纠音分析引擎 ===== */
function showCorrection(sentence) {
  const words = sentence.replace(/[.,!?;:'"()]/g, '').split(/\s+/).filter(Boolean);
  if (words.length === 0) return;
  
  // 存储当前句子信息供跟读使用
  speakingState.correctionSentence = sentence;
  speakingState.correctionWords = words;
  
  // 生成模拟分析结果（基于句子实际内容）
  const analysis = analyzePronunciation(sentence, words);
  speakingState.correctionAnalysis = analysis;

  // 低分词自动加入口语错题本
  const lowScoreWords = analysis.wordAnalysis.filter(w => w.score < 70);
  if (lowScoreWords.length > 0) {
    lowScoreWords.forEach(w => {
      const exists = DB.englishData.errorBook.find(e => e.content === w.word && e.type === '口语');
      if (!exists) {
        DB.englishData.errorBook.push({
          type: '口语',
          content: w.word + ' /' + (w.phonetic||'') + '/',
          date: today(),
          analysis: '发音得分' + w.score + '分 — ' + (w.issue || '需加强练习')
        });
      }
    });
    // 整句也记录
    const overallExists = DB.englishData.errorBook.find(e => e.content === sentence && e.type === '口语');
    if (!overallExists && analysis.scores.overall < 70) {
      DB.englishData.errorBook.push({
        type: '口语',
        content: sentence,
        date: today(),
        analysis: '整句评分' + analysis.scores.overall + '分 — ' + (analysis.overallFeedback || '需加强跟读练习')
      });
    }
    saveDB();
  }
  
  // 更新评分
  const scoreEls = {
    scoreOverall: document.getElementById('scoreOverall'),
    scorePron: document.getElementById('scorePron'),
    scoreStress: document.getElementById('scoreStress'),
    scoreFluency: document.getElementById('scoreFluency'),
  };
  if (scoreEls.scoreOverall) scoreEls.scoreOverall.textContent = analysis.scores.overall;
  if (scoreEls.scorePron) scoreEls.scorePron.textContent = analysis.scores.pronunciation;
  if (scoreEls.scoreStress) scoreEls.scoreStress.textContent = analysis.scores.stress;
  if (scoreEls.scoreFluency) scoreEls.scoreFluency.textContent = analysis.scores.fluency;

  // 渲染纠音详情
  const detailEl = document.getElementById('correctionDetail');
  if (!detailEl) return;

  let html = '<div class="correction-card"><div style="font-weight:700;margin-bottom:10px">📋 逐词纠音分析</div>';
  
  // 逐词分析 + 跟读按钮（两个独立按钮：反复听 + 跟读）
  analysis.wordAnalysis.forEach((item, wi) => {
    const scoreColor = item.score >= 85 ? '#28a745' : item.score >= 70 ? '#fd7e14' : '#dc3545';
    const hasIssue = item.issue && item.score < 85;
    html += `<div class="correction-item" id="corrItem${wi}">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
        <span><span class="correction-word">${item.word}</span><span class="correction-phonetic">${item.phonetic}</span></span>
        <span style="font-weight:700;color:${scoreColor};font-size:14px">${item.score}分</span>
      </div>
      <div class="correction-score-bar"><div class="correction-score-fill" style="width:${item.score}%;background:${scoreColor}"></div></div>
      ${item.issue ? `<div class="correction-advice">⚠️ ${item.issue}</div>` : `<div class="correction-advice" style="color:#28a745">✅ 发音标准</div>`}
      ${hasIssue ? `
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">
        <button class="follow-btn follow-listen-btn" id="listenBtn${wi}" onclick="replayDemoWord(${wi},'${item.word}')">🔊 反复听示范</button>
        <button class="follow-btn follow-record-btn" id="followBtn${wi}" onclick="startFollowRead(${wi},'${item.word}')">🎙 跟读录音</button>
      </div>
      <div id="followDemoArea${wi}" style="margin-top:4px"></div>
      <div id="followRecordArea${wi}" style="margin-top:4px"></div>
      <div id="followScoreArea${wi}" style="margin-top:4px"></div>
      ` : ''}
    </div>`;
  });

  html += '</div>';

  // 整体评价
  html += `<div class="correction-card" style="margin-top:10px">
    <div style="font-weight:700;margin-bottom:8px">🗣 整体评价</div>
    <div class="correction-advice">${analysis.overallFeedback}</div>
  </div>`;

  // 改进建议
  html += `<div class="correction-card" style="margin-top:10px">
    <div style="font-weight:700;margin-bottom:8px">💡 改进建议</div>`;
  analysis.suggestions.forEach(s => {
    html += `<div class="correction-advice" style="margin-bottom:4px">• ${s}</div>`;
  });
  html += '</div>';

  // 整句跟读区
  html += `<div class="correction-card" style="margin-top:10px">
    <div style="font-weight:700;margin-bottom:10px">🎯 整句跟读练习</div>
    <p class="text-sm text-gray mb-8">反复听整句示范 → 自己朗读录音 → 回放对比纠正</p>

      <button class="btn btn-outline btn-sm hidden" onclick="stopFullSentenceFollow()" id="fullFollowStopBtn">⏹ 停止录音</button>

    <div id="fullRecordArea" style="margin-top:4px"></div>
    <div id="fullScoreArea" style="margin-top:4px"></div>
  </div>`;

  detailEl.innerHTML = html;
  detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* 反复听示范 — 不限次数 */
function replayDemoWord(wi, word) {
  const btn = document.getElementById('listenBtn'+wi);
  const demoArea = document.getElementById('followDemoArea'+wi);
  if (btn) { btn.classList.add('playing'); btn.textContent = '🔊 播放中...'; }
  if (demoArea) demoArea.innerHTML = '👂 正在播放示范发音...';
  
  const playDemo = () => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US';
      u.rate = 0.7;
      
      const doSpeak = () => {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
          const ev = voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en'));
          if (ev) u.voice = ev;
        }
        u.onend = () => {
          if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 反复听示范'; }
          if (demoArea) demoArea.innerHTML = '✅ 示范播放完成，可点击再次听或开始跟读';
        };
        u.onerror = () => {
          if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 反复听示范'; }
          playDemoGoogle(word, btn, demoArea);
        };
        window.speechSynthesis.speak(u);
      };
      
      if (window.speechSynthesis.getVoices().length === 0) {
        const h = () => { window.speechSynthesis.removeEventListener('voiceschanged', h); doSpeak(); };
        window.speechSynthesis.addEventListener('voiceschanged', h);
        setTimeout(() => { window.speechSynthesis.removeEventListener('voiceschanged', h); doSpeak(); }, 600);
      } else { doSpeak(); }
    } else {
      playDemoGoogle(word, btn, demoArea);
    }
  };
  playDemo();
}

function playDemoGoogle(word, btn, demoArea) {
  const audio = new Audio();
  audio.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(word);
  audio.onended = () => {
    if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 反复听示范'; }
    if (demoArea) demoArea.innerHTML = '✅ 示范播放完成（在线），可点击再次听或开始跟读';
  };
  audio.onerror = () => {
    if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 反复听示范'; }
    if (demoArea) demoArea.innerHTML = '❌ 播放失败，请检查网络';
  };
  audio.play().catch(() => {
    if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 反复听示范'; }
    if (demoArea) demoArea.innerHTML = '❌ 播放失败，请检查网络';
  });
}

function startFollowRead(wi, word) {
  const btn = document.getElementById('followBtn'+wi);
  const recordArea = document.getElementById('followRecordArea'+wi);
  const scoreArea = document.getElementById('followScoreArea'+wi);
  if (!btn) return;
  
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (recordArea) recordArea.innerHTML = '❌ 浏览器不支持录音，请用 Chrome 浏览器';
    return;
  }
  
  // 清除之前的评分
  if (scoreArea) scoreArea.innerHTML = '';
  
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    if (!window.MediaRecorder) {
      if (recordArea) recordArea.innerHTML = '❌ 浏览器不支持录音';
      stream.getTracks().forEach(t => t.stop());
      return;
    }
    
    let mimeType = '';
    ['audio/webm;codecs=opus','audio/webm','audio/mp4',''].forEach(t => {
      if (!mimeType && (t === '' || MediaRecorder.isTypeSupported(t))) mimeType = t;
    });
    const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    const chunks = [];
    
    mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunks, { type: mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);
      
      btn.classList.remove('playing');
      btn.textContent = '🎙 再录一次';
      
      // 分开三个区域显示
      if (recordArea) {
        recordArea.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
            <span style="font-size:12px;color:#666">🎧 我的录音：</span>
            <audio src="${url}" controls style="height:28px;width:160px"></audio>

      // 评分独立显示

      if (scoreArea) {
        scoreArea.innerHTML = `
          <div style="margin-top:4px;font-size:13px">
            跟读评分：<b style="color:${improved?'#28a745':'#fd7e14'};font-size:15px">${followScore}分</b>
            <span style="margin-left:8px">${improved ? '✅ 进步明显！继续加油' : '💪 还有提升空间，多听几遍示范再试试'}</span>
          </div>`;
      }
      
      stream.getTracks().forEach(t => t.stop());
    };
    
    mr.start();
    btn.classList.add('playing');
    btn.textContent = '🔴 录音中...';
    if (recordArea) recordArea.innerHTML = '🎙 <b>正在录音，请大声跟读！</b>';
    
    setTimeout(() => {
      if (mr && mr.state === 'recording') mr.stop();
    }, 2500);
    
  }).catch(e => {
    if (recordArea) recordArea.innerHTML = '❌ ' + (e.name === 'NotAllowedError' ? '请允许麦克风权限' : e.message);
  });
}

    const u = new SpeechSynthesisUtterance(sentence);
    u.lang = 'en-US';
    u.rate = 0.75;
    
    const doSpeak = () => {
      const voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) {
        const ev = voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en'));
        if (ev) u.voice = ev;
      }
      u.onend = () => {
        if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 反复听整句示范'; }
        if (demoArea) demoArea.innerHTML = '✅ 整句示范播放完成，可再次点击听或开始跟读录音';
      };
      u.onerror = () => {
        if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 反复听整句示范'; }
        speakWordGoogle(sentence);
        if (demoArea) demoArea.innerHTML = '✅ 整句示范播放完成（在线），可再次点击听或开始跟读录音';
      };
      window.speechSynthesis.speak(u);
    };
    
    if (window.speechSynthesis.getVoices().length === 0) {
      const h = () => { window.speechSynthesis.removeEventListener('voiceschanged', h); doSpeak(); };
      window.speechSynthesis.addEventListener('voiceschanged', h);
      setTimeout(() => { window.speechSynthesis.removeEventListener('voiceschanged', h); doSpeak(); }, 600);
    } else { doSpeak(); }
  } else {
    speakWordGoogle(sentence);
    setTimeout(() => {
      if (btn) { btn.classList.remove('playing'); btn.textContent = '🔊 反复听整句示范'; }
      if (demoArea) demoArea.innerHTML = '✅ 整句示范播放完成（在线），可再次点击听或开始跟读录音';
    }, sentence.length * 60 + 2000);
  }
}

function startFullSentenceRecord() {
  const sentence = speakingState.correctionSentence;
  if (!sentence) return;
  const btn = document.getElementById('fullFollowBtn');
  const stopBtn = document.getElementById('fullFollowStopBtn');
  const recordArea = document.getElementById('fullRecordArea');
  const scoreArea = document.getElementById('fullScoreArea');
  
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (recordArea) recordArea.innerHTML = '❌ 浏览器不支持录音';
    return;
  }
  
  if (scoreArea) scoreArea.innerHTML = '';
  
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    if (!window.MediaRecorder) { stream.getTracks().forEach(t => t.stop()); return; }
    
    let mimeType = '';
    ['audio/webm;codecs=opus','audio/webm',''].forEach(t => {
      if (!mimeType && (t === '' || MediaRecorder.isTypeSupported(t))) mimeType = t;
    });
    const mr = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    const chunks = [];
    
    mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunks, { type: mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);
      
      if (btn) { btn.classList.remove('hidden'); btn.textContent = '🎙 再录一次'; }
      if (stopBtn) stopBtn.classList.add('hidden');
      
      // 录音回放区
      if (recordArea) {
        recordArea.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
            <span style="font-size:12px;color:#666">🎧 我的整句录音：</span>
            <audio src="${url}" controls style="height:28px;width:180px"></audio>
            <button class="btn-icon" onclick="replayFullSentenceDemo()" title="听示范对比" aria-label="听示范对比" style="font-size:14px">🔊 对比示范</button>
          </div>`;
      }
      
      // 评分区
      const newScore = 65 + Math.floor(Math.random() * 30);
      if (scoreArea) {
        scoreArea.innerHTML = `
          <div style="margin-top:4px;font-size:13px">
            整句跟读评分：<b style="color:${newScore>=80?'#28a745':'#fd7e14'};font-size:15px">${newScore}分</b>
            <span style="margin-left:8px">${newScore>=80 ? '✅ 很好！整句发音有明显进步' : '💪 建议多听示范，注意语调和节奏'}</span>
          </div>`;
      }
      
      stream.getTracks().forEach(t => t.stop());
    };
    
    mr.start();
    if (btn) btn.classList.add('hidden');
    if (stopBtn) stopBtn.classList.remove('hidden');
    if (recordArea) recordArea.innerHTML = '🔴 正在录音，请大声朗读整句...';
    
    const autoStopMs = Math.max(3000, (sentence || '').length * 80 + 2000);
    setTimeout(() => {
      if (mr && mr.state === 'recording') mr.stop();
    }, autoStopMs);
    
    if (stopBtn) stopBtn.onclick = () => { if (mr && mr.state === 'recording') mr.stop(); };
    
  }).catch(e => {
    if (recordArea) recordArea.innerHTML = '❌ ' + (e.name === 'NotAllowedError' ? '请允许麦克风权限' : e.message);
  });
}

function analyzePronunciation(sentence, words) {
  // 基于句子实际内容的智能分析
  // 提取关键发音难点
  const issues = [];
  
  words.forEach((word, i) => {
    const lower = word.toLowerCase();
    const phonetic = getApproxPhonetic(lower);
    
    // 检测常见发音难点
    let issue = null;
    let baseScore = 85 + Math.floor(Math.random() * 13); // 85-97 基础分
    
    // 检测 th 音
    if (/th/.test(lower)) {
      baseScore -= 8;
      issue = 'th 音（/θ/或/ð/）需舌尖轻触上齿，不要发成 s 或 z';
    }
    // 检测 r/l 混淆
    if (/^r/.test(lower) || /^l/.test(lower)) {
      baseScore -= 5;
      if (!issue) issue = '注意 r 和 l 的区分：r 舌尖卷起不碰口腔，l 舌尖顶住上齿龈';
    }
    // 检测长元音
    if (/ee|ea|oo|ou|ow/.test(lower)) {
      baseScore -= 4;
      if (!issue) issue = '长元音发音时长不够，需延长发音';
    }
    // 检测词尾辅音
    if (/[tdkpbgnm]$/.test(lower)) {
      baseScore -= 3;
      if (!issue) issue = '词尾辅音发音过重或遗漏，商务英语需清晰但不夸张';
    }
    // 检测重音位置（多音节词）
    if (lower.length > 6 && /[aeiou].*[aeiou].*[aeiou]/.test(lower)) {
      baseScore -= 6;
      if (!issue) issue = '多音节词重音位置可能不准确，请参考音标中的重音标记 (ˈ)';
    }
    // 检测连读标记
    if (i > 0) {
      const prevEnd = words[i-1].slice(-1).toLowerCase();
      const currStart = lower[0];
      if (/[aeiou]/.test(currStart) && /[tdkpbgnmrsz]/.test(prevEnd)) {
        baseScore -= 2;
        if (!issue) issue = '与前词可连读（辅音+元音），当前发音略显生硬';
      }
    }
    // 商务词汇特殊处理
    const bizWords = ['negotiate','acquisition','strategy','budget','revenue','colleague','proposal','promotion','investment','manufacturer','recruitment','expenditure','benchmark','outsourcing','wholesale'];
    if (bizWords.includes(lower)) {
      baseScore -= 5;
      if (!issue) issue = '商务高频词，注意发音的专业性和清晰度';
    }
    
    baseScore = Math.max(60, Math.min(98, baseScore));
    
    issues.push({
      word: word,
      phonetic: phonetic,
      score: baseScore,
      issue: issue
    });
  });

  // 计算总分
  const avgScore = Math.round(issues.reduce((s, it) => s + it.score, 0) / issues.length);
  const pronScore = Math.round(issues.reduce((s, it) => s + it.score, 0) / issues.length) + Math.floor(Math.random() * 5) - 2;
  const stressScore = Math.round(issues.filter(it => it.issue && it.issue.includes('重音')).length > 0 ? avgScore - 5 : avgScore + 3);
  const fluencyScore = Math.round(avgScore + Math.floor(Math.random() * 6) - 3);

  // 生成整体反馈
  let overallFeedback = '';
  const badWords = issues.filter(it => it.score < 75);
  if (badWords.length === 0) {
    overallFeedback = '🎉 整体发音非常出色！所有单词发音标准，语调和节奏感良好。继续保持这个水平，BEC口语高分不是问题。';
  } else if (badWords.length <= 2) {
    overallFeedback = `👍 整体表现不错！但在 "${badWords.map(w => w.word).join('、')}" 这几个词上需要加强练习。建议针对这些词多听示范并反复跟读。`;
  } else {
    overallFeedback = `📚 还有提升空间。在 ${badWords.length} 个词的发音上存在改进空间，特别是 "${badWords.slice(0,3).map(w => w.word).join('、')}"。建议放慢速度，逐词跟读练习。`;
  }

  // 生成建议
  const suggestions = [];
  if (issues.some(it => it.issue && it.issue.includes('th'))) {
    suggestions.push('重点练习 th 发音：舌尖放在上下齿之间，气流从舌面和上齿间通过，不要用 s/z 替代');
  }
  if (issues.some(it => it.issue && it.issue.includes('重音'))) {
    suggestions.push('多音节词注意重音位置：商务词汇中重音往往在第二个音节（如 neGOtiate, acQUIsition）');
  }
  if (issues.some(it => it.issue && it.issue.includes('连读'))) {
    suggestions.push('练习连读技巧：辅音结尾 + 元音开头的词要自然连起来读（如 "talk‿about", "meet‿up"）');
  }
  if (issues.some(it => it.issue && it.issue.includes('r') && it.issue.includes('l'))) {
    suggestions.push('区分 r 和 l：r 发音时舌尖卷起不碰任何部位，l 发音时舌尖顶住上齿龈');
  }
  suggestions.push('建议每天跟读 BBC 或 VOA 商务英语 10 分钟，模仿母语者的语调和节奏');
  suggestions.push('录音后回放对比示范发音，重点关注自己听不出来的发音偏差');

  return {
    scores: {
      overall: avgScore,
      pronunciation: Math.max(60, Math.min(98, pronScore)),
      stress: Math.max(60, Math.min(98, stressScore)),
      fluency: Math.max(60, Math.min(98, fluencyScore)),
    },
    wordAnalysis: issues,
    overallFeedback,
    suggestions: suggestions.slice(0, 4),
  };
}

async function startPresentationRecord() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast('❌ 浏览器不支持录音。Android 请用 Chrome 浏览器并允许麦克风权限');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!window.MediaRecorder) {
      showToast('❌ 浏览器不支持录音功能，请使用 Chrome/Edge 浏览器');
      stream.getTracks().forEach(t => t.stop());
      return;
    }
    let mimeType = '';
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', ''];
    for (const t of types) {
      if (t === '' || MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
    }
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    audioChunks = [];
    isPresentationRecord = true;
    currentRecordIdx = null;

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blobType = mimeType || 'audio/webm';
      const blob = new Blob(audioChunks, { type: blobType });
      const url = URL.createObjectURL(blob);
      const player = document.getElementById('presAudioPlayer');
      if (player) { player.src = url; player.style.display = 'block'; }
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.onerror = (e) => {
      showToast('❌ 录音出错：' + (e.error || '未知错误'));
      stream.getTracks().forEach(t => t.stop());
      const recBtn = document.getElementById('presRecBtn');
      const stopBtn = document.getElementById('presStopBtn');
      const status = document.getElementById('recordingStatus');
      if (recBtn) recBtn.classList.remove('hidden');
      if (stopBtn) stopBtn.classList.add('hidden');
      if (status) status.style.display = 'none';
    };

    mediaRecorder.start();
    const recBtn = document.getElementById('presRecBtn');
    const stopBtn = document.getElementById('presStopBtn');
    const status = document.getElementById('recordingStatus');
    if (recBtn) recBtn.classList.add('hidden');
    if (stopBtn) stopBtn.classList.remove('hidden');
    if (status) status.style.display = 'block';
    showToast('🔴 正在录音作答...');
  } catch(e) {
    const errMsg = e.name === 'NotAllowedError' ? '麦克风权限被拒绝，请在浏览器设置中允许麦克风访问'
      : e.name === 'NotFoundError' ? '未检测到麦克风设备'
      : e.message;
    showToast('❌ ' + errMsg);
  }
}

function stopPresentationRecord() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    const recBtn = document.getElementById('presRecBtn');
    const stopBtn = document.getElementById('presStopBtn');
    const status = document.getElementById('recordingStatus');
    if (recBtn) recBtn.classList.remove('hidden');
    if (stopBtn) stopBtn.classList.add('hidden');
    if (status) status.style.display = 'none';
    showToast('✅ 录音完成，可回放');
  }
}

function answerReading(choice, correct, title) {
  const opts = document.querySelectorAll('#quizOptions .quiz-opt');
  opts.forEach((el, i) => {
    if (i === correct) el.classList.add('correct');
    else if (i === choice && choice !== correct) el.classList.add('wrong');
    el.style.pointerEvents = 'none';
  });
  if (choice === correct) {
    readingState.score++;
    showToast('✅ 正确！');
  } else {
    const passage = READING_PASSAGES.find(p => p.title === title);
    const q = passage ? passage.questions[readingState.qIdx] : null;
    DB.englishData.errorBook.push({
      type:'阅读',
      content: q ? q.q : title,
      date: today(),
      analysis: '正确答案：' + (q ? q.opts[q.ans] : '—')
    });
    saveDB();
    showToast('❌ 错误，已加入错题本');
  }
  addEnglishStudy('reading', studyMinOf('reading'));
  setTimeout(() => {
    readingState.qIdx++;
    switchPage('english','english-reading');
  }, 1200);
}

/* ===== 通用工具 ===== */
function fitWeekKeyOf(date) { return bodyWeekRange(date).monday; }
function fitDow(date) { const d = new Date(date + 'T00:00:00').getDay(); return d === 0 ? 7 : d; }
function bodyWeekRange(date) {
  const dow = new Date(date + 'T00:00:00').getDay();
  const monday = addDays(date, dow === 0 ? -6 : 1 - dow);
  return { monday, sunday: addDays(monday, 6) };
}
function currentWeightKg() {
  const cfg = DB.fitnessConfig || {};
  if (cfg.currentWeight && cfg.currentWeight > 0) return cfg.currentWeight;
  const w = DB.weightRecords;
  return w.length ? w[w.length - 1].weight : 0;
}

/* 周计划横向分页辅助函数 */
let fitWeekScrolling = false;
function fitCenterWeekPages() {
  const el = document.getElementById('fitWeekPages');
  if (!el || el.children.length < 2) return;
  const target = el.children[1].offsetLeft;
  if (Math.abs(el.scrollLeft - target) > 2) {
    fitWeekScrolling = true;
    el.scrollLeft = target;
    setTimeout(() => { fitWeekScrolling = false; }, 250);
  }
}
function fitWeekScrollEnd(el) {
  if (fitWeekScrolling) return;
  const pages = Array.from(el.children);
  if (!pages.length) return;
  const center = el.scrollLeft + el.clientWidth / 2;
  let nearest = pages[0];
  let minDist = Infinity;
  pages.forEach(p => {
    const pc = p.offsetLeft + p.offsetWidth / 2;
    const dist = Math.abs(pc - center);
    if (dist < minDist) { minDist = dist; nearest = p; }
  });
  const newStart = nearest.dataset.start;
  if (newStart && newStart !== fitPlanWeekKey) {
    fitPlanWeekKey = newStart;
    switchPage('fitness', '');
  }
}
function exCalorie(met, minutes) {
  return Math.round(met * currentWeightKg() * (minutes / 60));
}
function fitWeightAt(date) {
  const rs = DB.weightRecords.filter(w => w.date === date);
  return rs.length ? rs[rs.length - 1].weight : null;
}
function fitBodyAt(date) {
  const rs = DB.weightRecords.filter(w => w.date === date);

}
function fitAvgWeight7d() {
  const from = addDays(today(), -7);
  const rs = DB.weightRecords.filter(w => w.date >= from);
  if (!rs.length) return null;
  return rs.reduce((s, w) => s + w.weight, 0) / rs.length;
}
function fitGoalDistance() {
  const cur = currentWeightKg();
  const target = DB.fitnessConfig.targetWeight || 0;
  if (!cur || !target) return null;
  return cur - target;
}
function fitGoalProgress() {
  const init = DB.fitnessConfig.initialWeight || 0;
  const target = DB.fitnessConfig.targetWeight || 0;
  const cur = currentWeightKg() || init;
  if (!init || !target || init <= target) return 0;
  return Math.min(100, Math.max(0, Math.round((init - cur) / (init - target) * 100)));
}
function fitDateLabel(date) {
  const d = new Date(date + 'T00:00:00');
  const days = ['周日','周一','周二','周三','周四','周五','周六'];

function fitShortDate(date) { return date.slice(5).replace('-', '.'); }
function fitFoodByName(name) {

}
function fitDayMacros(date) {
  const items = DB.dietRecords[date] || [];
  let p = 0, c = 0, f = 0, cal = 0, hasMacro = true;
  items.forEach(it => {
    cal += it.calories || 0;
    if (it.protein != null) { p += it.protein; c += (it.carbs || 0); f += (it.fat || 0); }
    else hasMacro = false;
  });
  if (!hasMacro && cal > 0) {
    const m = DB.fitnessConfig.macros || { protein:26, carbs:45, fat:29 };
    p = cal * (m.protein / 100) / 4;
    c = cal * (m.carbs / 100) / 4;
    f = cal * (m.fat / 100) / 9;
  }
  return { protein:p, carbs:c, fat:f, cal };
}
function fitMacroTargets() {
  const cfg = DB.fitnessConfig;
  // 根据当前身高体重自动定制：蛋白质 2.0g/kg、脂肪 0.8g/kg，碳水用剩余热量补足
  const weight = currentWeightKg() || cfg.initialWeight || (cfg.height ? (cfg.height * 0.42) : 60);
  const cal = fitCalorieTarget();
  const protein = +(weight * 2.0).toFixed(1);
  const fat = +(weight * 0.8).toFixed(1);
  let carbCal = cal - protein * 4 - fat * 9;
  if (carbCal < 0) carbCal = 0;
  const carbs = +(carbCal / 4).toFixed(1);
  return { protein, carbs, fat };
}
function fitEstimatedBMR(weight, height, age, gender) {
  // Mifflin-St Jeor 公式
  let bmr = 10 * weight + 6.25 * height - 5 * age;
  bmr += (gender === '男') ? 5 : -161;
  return Math.round(bmr);
}
function fitEstimatedTDEE(weight, height, age, gender, activityCoefficient) {
  return Math.round(fitEstimatedBMR(weight, height, age, gender) * (activityCoefficient || 1.375));
}
function fitRecommendedCalories(weight, height, age, gender, activityCoefficient) {
  const tdee = fitEstimatedTDEE(weight, height, age, gender, activityCoefficient);
  // 减脂建议：TDEE - 500 kcal，女性不低于 1200，男性不低于 1400
  let target = tdee - 500;
  const min = (gender === '男') ? 1400 : 1200;
  if (target < min) target = min;
  return Math.round(target);
}
function fitCalorieTarget() {
  const cfg = DB.fitnessConfig;
  return cfg.dailyCalorieTarget || fitRecommendedCalories(
    currentWeightKg() || cfg.initialWeight || (cfg.height ? cfg.height * 0.42 : 60),
    cfg.height || 162,
    cfg.age || 25,
    cfg.gender || '女',
    cfg.activityCoefficient || 1.375
  );
}
function fitRefreshCalorieTarget() {
  const cfg = DB.fitnessConfig;
  cfg.dailyCalorieTarget = fitRecommendedCalories(
    currentWeightKg() || cfg.initialWeight || (cfg.height ? cfg.height * 0.42 : 60),
    cfg.height || 162,
    cfg.age || 25,
    cfg.gender || '女',
    cfg.activityCoefficient || 1.375
  );
}
function fitEstimateBodyFat(weight, height, age, gender) {
  // 基于 BMI 的 Deurenberg 估算公式
  const hM = height / 100;
  const bmi = weight / (hM * hM);
  const sex = (gender === '男') ? 1 : 0;
  const bf = 1.20 * bmi + 0.23 * age - (10.8 * sex) - 5.4;
  return Math.max(5, Math.min(60, +bf.toFixed(1)));
}
function fitEstimatedBodyFatStr() {
  const cfg = DB.fitnessConfig;
  const w = currentWeightKg() || cfg.initialWeight || (cfg.height ? cfg.height * 0.42 : 60);
  if (!w || !cfg.height) return '--';
  return fitEstimateBodyFat(w, cfg.height, cfg.age || 25, cfg.gender || '女') + '%';
}

function fitPlanItems(weekKey) {

/* ===== 趋势图（纯 SVG） ===== */
function buildLineChart(cfg) {
  const width = cfg.width || 330, height = cfg.height || 180;
  const labels = cfg.labels || [];
  const series = cfg.series || [];
  const padL = 44, padR = 14, padT = 18, padB = 28;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const all = [];
  series.forEach(s => (s.data || []).forEach(v => { if (v != null && !isNaN(v)) all.push(v); }));
  if (all.length === 0) return null;
  let min = Math.min.apply(null, all), max = Math.max.apply(null, all);
  const pad = (max - min) * 0.12;
  min -= pad; max += pad;
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  const n = labels.length;
  const xAt = i => n <= 1 ? padL + plotW / 2 : padL + plotW * i / (n - 1);
  const yAt = v => padT + plotH * (1 - (v - min) / range);
  let svg = '<svg viewBox="0 0 ' + width + ' ' + height + '" width="100%" style="display:block" preserveAspectRatio="xMidYMid meet">';
  const steps = 4;
  for (let g = 0; g <= steps; g++) {
    const val = min + range * g / steps;
    const yy = yAt(val);
    svg += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (width - padR) + '" y2="' + yy.toFixed(1) + '" stroke="#ece6d8" stroke-width="1"/>';
    svg += '<text x="' + (padL - 8) + '" y="' + (yy + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="#b3a98f">' + (Math.round(val * 10) / 10) + '</text>';
  }
  labels.forEach((lb, i) => {
    if (i % Math.ceil(n / 5) === 0) svg += '<text x="' + xAt(i).toFixed(1) + '" y="' + (height - 10) + '" text-anchor="middle" font-size="10" fill="#8a8a7a">' + lb + '</text>';
  });
  series.forEach(s => {
    const pts = [];
    (s.data || []).forEach((v, i) => { if (v != null && !isNaN(v)) pts.push([xAt(i), yAt(v)]); });
    if (pts.length) {
      const path = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
      svg += '<path d="' + path + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
      pts.forEach(p => { svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + s.color + '"/>'; });
    }
  });
  svg += '</svg>';
  return svg;
}
function weightTrendRange(days) {
  const all = DB.weightRecords.slice().sort((a, b) => a.time - b.time);
  let recs = all;
  if (days > 0) { const from = addDays(today(), -days); recs = all.filter(w => w.date >= from); }
  const byDay = {};
  recs.forEach(w => { if (!byDay[w.date] || byDay[w.date].time < w.time) byDay[w.date] = w; });
  const dates = Object.keys(byDay).sort();
  if (dates.length < 2) return null;
  return buildLineChart({ width: 340, height: 200, labels: dates.map(d => d.slice(5).replace('-','/')), series: [{ name: '体重', color: '#2d5a45', data: dates.map(d => byDay[d].weight) }] });
}
function weightTrendCustom(start, end) {
  const all = DB.weightRecords.slice().sort((a, b) => a.time - b.time);
  const recs = all.filter(w => w.date >= start && w.date <= end);
  const byDay = {};
  recs.forEach(w => { if (!byDay[w.date] || byDay[w.date].time < w.time) byDay[w.date] = w; });
  const dates = Object.keys(byDay).sort();
  if (dates.length < 2) return null;
  return buildLineChart({ width: 340, height: 200, labels: dates.map(d => d.slice(5).replace('-','/')), series: [{ name: '体重', color: '#2d5a45', data: dates.map(d => byDay[d].weight) }] });
}

function fitRing(pct, color, size) {
  const r = size / 2 - 6;
  const c = 2 * Math.PI * r;
  const p = Math.min(100, Math.max(0, pct));
  const off = c * (1 - p / 100);
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="display:block">'
    + '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#ece6d8" stroke-width="6"/>'
    + '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>'
    + '<text x="' + size / 2 + '" y="' + (size / 2 + 4) + '" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2a28">' + pct + '%</text>'

    + buildWeekPage(prevMonday)
    + buildWeekPage(monday)
    + buildWeekPage(nextMonday)
    + '</div></div>';

  const allEx = [];
  Object.keys(DB.exerciseRecords).forEach(d => DB.exerciseRecords[d].forEach((e, idx) => allEx.push({ date: d, idx, ...e })));
  allEx.sort((a, b) => b.time - a.time);
  const doneCount = allEx.length;

  html += '<div class="dashboard-grid">'
    + '<div class="card" id="fitTodayPlanPanel">' + renderTodayPlanPanel(fitPlanSelectedDay) + '</div>'
    + '<div class="card">'
    + '<div class="card-title">训练历史 <span style="float:right;font-size:12px;color:var(--text-light);font-weight:400">已完成 ' + doneCount + ' 次</span></div>';
  if (doneCount === 0) {
    html += '<div class="fit-empty-box"><div class="fit-empty-title">完成第一场训练后会显示在这里</div></div>';
  } else {
    html += '<div class="fit-mini-list">';
    allEx.slice(0, 8).forEach(e => {
      html += '<div class="fit-mini-item"><span>' + e.date + ' · ' + escapeHTML(e.type) + (e.count ? ' ×' + e.count : '') + (e.note ? ' · ' + escapeHTML(e.note) : '') + '</span><span>' + (e.calories || 0) + ' kcal</span></div>';
    });
    html += '</div>';
  }
  html += '</div></div>';

  setTimeout(fitCenterWeekPages, 0);
  return html;
}
function renderTodayPlanPanel(day) {
  const dow = fitDow(day);
  const wk = fitWeekKeyOf(day);
  const items = fitPlanItems(wk).filter(it => it.dow === dow);
  let html = '<div class="card-title">今日训练 <span style="float:right;font-size:12px;color:var(--text-light);font-weight:400">' + day.slice(5).replace('-','月') + '日 ' + fitDowName(day) + '</span><button class="btn btn-primary btn-sm" onclick="quickAddPlan(' + dow + ')" style="float:right;margin-right:8px">+ 安排训练</button></div>';
  if (items.length === 0) {
    html += '<div class="fit-empty-box">'
      + '<div class="fit-empty-title">这一天没有训练安排</div>'
      + '<div class="fit-empty-desc">点击右上角按钮添加。</div>'
      + '</div>';
  } else {
    html += '<div class="fit-plan-list">';
    items.forEach(it => {
      const done = (it.doneDates || []).indexOf(day) >= 0;
      html += '<div class="fit-plan-item ' + (done ? 'done' : '') + '">'
        + '<span class="fit-plan-check" onclick="event.stopPropagation(); togglePlanDoneForDay(\'' + it.id + '\', \'' + day + '\')">' + (done ? '✓' : '') + '</span>'
        + '<span class="fit-plan-name" onclick="event.stopPropagation(); editPlanItem(\'' + it.id + '\', \'' + day + '\')">' + escapeHTML(it.type) + (it.count ? ' ×' + it.count : '') + (it.note ? '<br><span style="font-size:11px;color:var(--text-light)">' + escapeHTML(it.note) + '</span>' : '') + '</span>'
        + '<span class="fit-plan-dur" onclick="event.stopPropagation(); editPlanItem(\'' + it.id + '\', \'' + day + '\')">' + getPlanItemCalories(it) + ' kcal · ' + it.duration + ' 分钟</span>'
        + '</div>';
    });
    html += '</div>';
  }
  return html;
}
function selectPlanDay(day) {
  fitPlanSelectedDay = day;
  document.querySelectorAll('.fit-day-card').forEach(el => el.classList.remove('selected'));
  const active = document.querySelector('.fit-day-card[data-day="' + day + '"]');
  if (active) active.classList.add('selected');
  const panel = document.getElementById('fitTodayPlanPanel');
  if (panel) panel.innerHTML = renderTodayPlanPanel(day);
}
function togglePlanDoneForDay(id, day) {
  event.stopPropagation();
  const wk = fitWeekKeyOf(day);
  const it = (DB.fitnessPlan[wk] || []).find(x => x.id === id);
  if (!it) return;
  if (!it.doneDates) it.doneDates = [];
  const idx = it.doneDates.indexOf(day);
  if (idx >= 0) {
    it.doneDates.splice(idx, 1);
    if (DB.exerciseRecords[day]) DB.exerciseRecords[day] = DB.exerciseRecords[day].filter(e => e.planId !== it.id);
  } else {
    it.doneDates.push(day);
    const cal = getPlanItemCalories(it);
    if (!DB.exerciseRecords[day]) DB.exerciseRecords[day] = [];
    DB.exerciseRecords[day].push({ planId: it.id, type: it.type, duration: it.duration, count: it.count, note: it.note, calories: cal, time: Date.now() });
  }
  saveDB(); switchPage('fitness', '');
}
function getPlanItemCalories(it) {
  if (!it) return 0;
  if (it.calManual) return it.calManual;
  const x = EXERCISE_LIBRARY.find(e => e.name === it.type);
  return x ? exCalorie(x.met, it.duration) : 0;
}

function saveBodyRecord() {
  const d = weightEntryDate;
  const weight = parseFloat(document.getElementById('brWeight').value);
  const bodyFat = parseFloat(document.getElementById('brBodyFat').value) || null;
  const waist = parseFloat(document.getElementById('brWaist').value) || 0;

  const note = document.getElementById('brNote').value;
  if (!weight || weight <= 0) { showToast('请输入体重'); return; }
  if (d === today()) {
    DB.fitnessConfig.currentWeight = weight;
    fitRefreshCalorieTarget();
  }
  if (editBodyTime) {
    const idx = DB.weightRecords.findIndex(x => x.time === editBodyTime);
    if (idx >= 0) DB.weightRecords[idx] = { ...DB.weightRecords[idx], date: d, weight, bodyFat, note, time: editBodyTime };

    DB.weightRecords.push({ date: d, weight, bodyFat, note, time: Date.now() });
  }
  if (waist || hip) {
    if (!DB.circumferenceRecords) DB.circumferenceRecords = [];

    if (cidx >= 0) DB.circumferenceRecords[cidx] = { ...DB.circumferenceRecords[cidx], date: d, waist, hip };

}

function pickFood(name) {
  inFoodPicker = false;
  if (dietDraft) {
    dietDraft.values = dietDraft.values || {};
    dietDraft.values.name = name;
    dietDraft.values.unit = dietDraft.values.unit || '克';

function calcFoodCal() {
  const n = document.getElementById('foodName');
  const u = document.getElementById('foodUnit');
  const amt = document.getElementById('foodAmount');
  const perG = document.getElementById('foodPerG');
  const c = document.getElementById('foodCal');
  if (!n || !u || !amt || !c) return;
  const f = fitFoodByName(n.value);
  let grams = 0;
  const unit = u.value;
  if (unit === '克') grams = parseFloat(amt.value) || 0;
  else if (perG && parseFloat(perG.value)) grams = (parseFloat(amt.value) || 0) * parseFloat(perG.value);
  if (f && grams) c.value = Math.round(f.per100.cal * grams / 100);
}
function saveDietNew(date, meal) {
  const name = document.getElementById('foodName').value.trim();
  const unit = document.getElementById('foodUnit').value;
  const amount = parseFloat(document.getElementById('foodAmount').value) || 0;
  const perG = unit === '克' ? 1 : (parseFloat(document.getElementById('foodPerG').value) || 0);
  let cal = parseInt(document.getElementById('foodCal').value) || 0;
  if (!name) { showToast('请输入食物名称'); return; }
  const grams = unit === '克' ? amount : (amount * perG);
  const f = fitFoodByName(name);
  let p = null, c2 = null, fa = null;
  if (f && grams) {
    cal = Math.round(f.per100.cal * grams / 100);
    p = +(f.per100.p * grams / 100).toFixed(1);
    c2 = +(f.per100.c * grams / 100).toFixed(1);
    fa = +(f.per100.f * grams / 100).toFixed(1);
  } else if (!cal) { showToast('请输入热量'); return; }
  if (!DB.dietRecords[date]) DB.dietRecords[date] = [];
  DB.dietRecords[date].push({ name, unit: unit, amount: amount || null, perUnitG: unit === '克' ? null : (perG || null), grams: grams || null, calories: cal, protein: p, carbs: c2, fat: fa, meal, time: Date.now() });
  saveDB(); closeModal(); switchPage('fitness', ''); showToast('已添加：' + name);
}
function editDietRecord(date, meal, time) {
  const rec = (DB.dietRecords[date] || []).find(d => d.meal === meal && d.time === time);
  if (!rec) return;
  dietDraft = { date, meal, editTime: time, values: {
    name: rec.name || '',
    amount: rec.amount != null ? rec.amount : (rec.grams || ''),
    unit: rec.unit || '克',
    perG: rec.perUnitG || '',
    cal: rec.calories || ''
  }};
  showModal(renderDietFormHTML(date, meal, dietDraft.values, true));
  setTimeout(togglePerG, 0);
}
function saveDietEdit() {
  if (!dietDraft || !dietDraft.editTime) { closeModal(); return; }
  const date = dietDraft.date, meal = dietDraft.meal, time = dietDraft.editTime;
  const name = document.getElementById('foodName').value.trim();
  const unit = document.getElementById('foodUnit').value;
  const amount = parseFloat(document.getElementById('foodAmount').value) || 0;
  const perG = unit === '克' ? 1 : (parseFloat(document.getElementById('foodPerG').value) || 0);
  let cal = parseInt(document.getElementById('foodCal').value) || 0;
  if (!name) { showToast('请输入食物名称'); return; }
  const grams = unit === '克' ? amount : (amount * perG);
  const f = fitFoodByName(name);
  let p = null, c2 = null, fa = null;
  if (f && grams) {
    cal = Math.round(f.per100.cal * grams / 100);
    p = +(f.per100.p * grams / 100).toFixed(1);
    c2 = +(f.per100.c * grams / 100).toFixed(1);
    fa = +(f.per100.f * grams / 100).toFixed(1);
  } else if (!cal) { showToast('请输入热量'); return; }
  if (!DB.dietRecords[date]) DB.dietRecords[date] = [];
  const idx = DB.dietRecords[date].findIndex(d => d.meal === meal && d.time === time);
  const next = { name, unit: unit, amount: amount || null, perUnitG: unit === '克' ? null : (perG || null), grams: grams || null, calories: cal, protein: p, carbs: c2, fat: fa, meal, time: Date.now() };
  if (idx >= 0) DB.dietRecords[date][idx] = next; else DB.dietRecords[date].push(next);
  saveDB(); closeModal(); switchPage('fitness', ''); showToast('已更新：' + name);
}
function deleteDiet(date, meal, time) {

  saveDB(); closeModal(); switchPage('fitness', ''); showToast('训练已更新');
}
function togglePlanDone(id) {
  const wk = fitWeekKeyOf(today());
  const it = (DB.fitnessPlan[wk] || []).find(x => x.id === id);
  if (!it) return;
  const t0 = today();
  if (!it.doneDates) it.doneDates = [];
  const idx = it.doneDates.indexOf(t0);
  if (idx >= 0) {
    it.doneDates.splice(idx, 1);
    if (DB.exerciseRecords[t0]) DB.exerciseRecords[t0] = DB.exerciseRecords[t0].filter(e => e.planId !== it.id);
  } else {
    it.doneDates.push(t0);
    const cal = getPlanItemCalories(it);
    if (!DB.exerciseRecords[t0]) DB.exerciseRecords[t0] = [];
    DB.exerciseRecords[t0].push({ planId: it.id, type: it.type, duration: it.duration, count: it.count, note: it.note, calories: cal, time: Date.now() });
  }
  saveDB(); switchPage('fitness', '');
}

  const lastWk = addDays(fitPlanWeekKey, -7);
  const src = DB.fitnessPlan[lastWk] || [];
  if (!src.length) { showToast('上周没有计划可复制'); return; }
  if (!DB.fitnessPlan[fitPlanWeekKey]) DB.fitnessPlan[fitPlanWeekKey] = [];
  src.forEach(it => DB.fitnessPlan[fitPlanWeekKey].push({ id: uid('plan'), dow: it.dow, type: it.type, duration: it.duration, doneDates: [] }));
  saveDB(); switchPage('fitness', ''); showToast('已复制上周计划');

function fitFormInput(label, id, type, value) {
  return '<div class="fit-form-field"><label>' + label + '</label><input class="fit-input" type="' + type + '" id="' + id + '" value="' + (value != null ? value : '') + '"></div>';
}
function fitFormSelect(label, id, options, value) {
  return '<div class="fit-form-field"><label>' + label + '</label><select class="fit-select" id="' + id + '">' + options.map(([v,t]) => '<option value="' + v + '" ' + (String(value)===String(v)?'selected':'') + '>' + t + '</option>').join('') + '</select></div>';
}
function fitEnergyCalc() {
  const cfg = DB.fitnessConfig;
  const weight = currentWeightKg() || cfg.initialWeight || 60;
  const height = cfg.height || 162;
  const age = cfg.age || 25;
  const gender = cfg.gender || '女';
  const act = cfg.activityCoefficient || 1.375;
  let bmr = 10 * weight + 6.25 * height - 5 * age + (gender === '男' ? 5 : -161);
  if (!weight || !height || !age) bmr = 0;
  const tdee = bmr * act;
  const bmi = weight && height ? weight / Math.pow(height / 100, 2) : 0;
  return { bmr, tdee, bmi };
}
function fitDayDiff(a, b) {
  return Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);

function seedFitnessDemo() {
  const rng = mulberry32(20260813);
  const t0 = today();
  // 体重：66.5 -> 62.5 kg
  let w = 66.5;
  for (let off = -60; off <= 0; off++) {
    if (rng() < 0.35) continue;
    const d = addDays(t0, off);
    w += (62.5 - 66.5) / 60 + (rng() - 0.5) * 0.25;
    const bodyFat = +(29 + (w - 66.5) / (62.5 - 66.5) * (26 - 29) + (rng() - 0.5) * 0.4).toFixed(1);
    DB.weightRecords.push({ date: d, weight: +w.toFixed(1), bodyFat, note: '晨起空腹', time: Date.now() + off * 86400000, demo: true });
    if (new Date(d + 'T00:00:00').getDay() === 1) {
      const waist = +(78 + (w - 66.5) / (62.5 - 66.5) * (73 - 78) + (rng() - 0.5) * 0.6).toFixed(1);
      DB.circumferenceRecords.push({ date: d, waist, hip: 92, thigh: 0, calf: 0, chest: 0, time: Date.now() + off * 86400000, demo: true });
    }
  }
  // 饮食
  const meals = [['早餐','鸡蛋',100],['早餐','燕麦片',40],['早餐','无糖希腊酸奶',150],['午餐','鸡胸肉',150],['午餐','米饭',200],['午餐','西兰花',150],['晚餐','北豆腐',150],['晚餐','红薯',150],['晚餐','鸡蛋',100],['加餐','香蕉',120],['加餐','苹果',150]];
  for (let off = -14; off <= 0; off++) {
    if (off === 0 && rng() < 0.3) continue;
    const d = addDays(t0, off);
    const n = 2 + Math.floor(rng() * 2);
    for (let i = 0; i < n; i++) {
      const [meal, name, g] = meals[Math.floor(rng() * meals.length)];
      const f = fitFoodByName(name);
      if (!f) continue;
      const cal = Math.round(f.per100.cal * g / 100);
      if (!DB.dietRecords[d]) DB.dietRecords[d] = [];
      DB.dietRecords[d].push({ name, grams: g, calories: cal, protein: +(f.per100.p * g / 100).toFixed(1), carbs: +(f.per100.c * g / 100).toFixed(1), fat: +(f.per100.f * g / 100).toFixed(1), meal, time: Date.now() + off * 86400000 + Math.floor(rng() * 8e6), demo: true });
    }
  }
  // 运动
  const exList = [['慢跑',30],['快走',40],['力量训练',35],['瑜伽',30],['跳绳',15],['骑行',45],['HIIT',25]];
  for (let off = -20; off <= 0; off++) {
    if (rng() < 0.45) continue;
    const d = addDays(t0, off);
    const [type, dur] = exList[Math.floor(rng() * exList.length)];
    const x = EXERCISE_LIBRARY.find(e => e.name === type);
    const cal = x ? exCalorie(x.met, dur) : 0;
    if (!DB.exerciseRecords[d]) DB.exerciseRecords[d] = [];
    DB.exerciseRecords[d].push({ type, duration: dur, calories: cal, note: '', time: Date.now() + off * 86400000, demo: true });
  }
  // 恢复
  for (let off = -10; off <= 0; off++) {
    const d = addDays(t0, off);
    DB.recoveryRecords[d] = { sleep: +(6.5 + rng() * 2).toFixed(1), water: 1500 + Math.floor(rng() * 1000), energy: 2 + Math.floor(rng() * 4), soreness: 1 + Math.floor(rng() * 3), note: '', time: Date.now() + off * 86400000, demo: true };
  }
  // 步数
  for (let off = -14; off <= 0; off++) DB.stepRecords[addDays(t0, off)] = 4000 + Math.floor(rng() * 7000);
  // 本周计划
  const wk = fitWeekKeyOf(t0);
  DB.fitnessConfig.targetWeight = 50;
  DB.fitnessConfig.initialWeight = 66.5;
  DB.fitnessConfig.dailyCalorieTarget = 1700;
  DB.fitnessConfig.stepsTarget = 8000;
  DB.fitnessConfig.macros = { protein:26, carbs:45, fat:29 };
  DB.fitnessConfig.gender = '女';
  DB.fitnessConfig.age = 25;
  DB.fitnessConfig.height = 162;
  DB.fitnessConfig.activityCoefficient = 1.375;
  DB.fitnessConfig.nickname = 'Leah';
  DB.fitnessConfig.targetDate = addDays(t0, 180);
  DB.fitnessConfig.waterTarget = 2000;
  DB.fitnessConfig.sleepTarget = 7.5;
  DB.fitnessConfig.weeklyTrainingDays = 5;
  const plan = [[1,'慢跑',30],[2,'力量训练',35],[3,'快走',40],[4,'瑜伽',30],[5,'HIIT',25],[6,'骑行',45]];
  DB.fitnessPlan[wk] = plan.map(([dow, type, dur]) => ({ id: uid('plan'), dow, type, duration: dur, doneDates: [], demo: true }));
  DB.fitnessConfig.fitnessDemoSeededV4 = true;
}

      </div>`;
    });
    html += '</div>';
  }
  html += '</div>';

  // 收支趋势（整月展示，可切换年份/月份）
  const tmYear = financeTrendMonth.slice(0,4);
  const tmMonth = parseInt(financeTrendMonth.slice(5), 10);
  html += `<div class="chart-container">
    <div class="flex-between mb-12">
      <div class="card-title" style="margin-bottom:0">📈 收支趋势（整月）</div>
      <div class="flex-row gap-sm">
        <button class="btn-icon btn-sm" onclick="changeFinanceTrendMonth(-1)" aria-label="上一月">◀</button>

        <button class="btn-icon btn-sm" onclick="changeFinanceTrendMonth(1)" aria-label="下一月">▶</button>
      </div>
    </div>
    <div id="financeChart"></div>
  </div>`;

  // 储蓄进度
  const mg = (DB.savingsGoals && DB.savingsGoals[financeViewMonth]) || { target: 0, actual: 0 };
  const ovYear = financeViewMonth.slice(0, 4);
  const yg = (DB.yearSavingGoals && DB.yearSavingGoals[ovYear]) || { target: 0, actual: null };
  let ovYearActualSum = 0;
  if (DB.savingsGoals) {
    for (let mm = 1; mm <= 12; mm++) {
      const key = ovYear + '-' + String(mm).padStart(2, '0');
      ovYearActualSum += (DB.savingsGoals[key] && DB.savingsGoals[key].actual) || 0;
    }
  }
  const ovYearActual = (yg.actual !== null && yg.actual !== undefined) ? yg.actual : ovYearActualSum;
  const ovYearTarget = yg.target || 0;

      <div class="progress-bar"><div class="progress-fill" style="width:${(mg.target||0)>0?Math.min(100,Math.round((mg.actual||0)/(mg.target||0)*100)):0}%"></div></div>
    </div>
  </div>`;

  // 延迟渲染整月趋势图
  setTimeout(() => {
    const el = document.getElementById('financeChart');
    if (!el) return;
    const [ty, tm2] = financeTrendMonth.split('-').map(Number);
    const daysInMonth = new Date(ty, tm2, 0).getDate();
    const trendData = [];
    for (let day = 1; day <= daysInMonth; day++) {
      const d = ty + '-' + String(tm2).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      const bills = DB.bills.filter(b => b.date === d);
      trendData.push({ date: String(day), income: bills.filter(b=>b.type==='income').reduce((s,b)=>s+b.amount,0), expense: bills.filter(b=>b.type==='expense').reduce((s,b)=>s+b.amount,0) });

    const days = daysInMonth;
    const maxVal = Math.max(...trendData.map(d => Math.max(d.income, d.expense)), 1);
    let svg = '<svg width="100%" height="180" viewBox="0 0 400 180">';
    svg += '<line x1="30" y1="150" x2="385" y2="150" stroke="#d4e0cc" stroke-width="1"/>';

    svg += '</svg>';
    el.innerHTML = svg;
  }, 50);

  return html;
}

/* 储蓄目标 */
function daysBetween(a, b) {
  const ms = new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00');
  return Math.max(0, Math.floor(ms / 86400000));
}
function calcAccount(a, viewDate) {
  const amt = Number(a.amount || 0);
  if (a.type !== 'time') {
    return { currentValue: amt, maturityValue: amt, accruedInterest: 0, matured: false };
  }
  const rate = parseFloat(a.rate) || 0;
  const start = a.startDate || viewDate;
  const end = a.maturityDate || start;
  const totalDays = daysBetween(start, end) || 1;
  const maturityValue = amt + amt * rate / 100 * (totalDays / 365);
  const effEnd = (viewDate > end) ? end : viewDate;
  const accruedDays = daysBetween(start, effEnd);
  let accruedInterest = amt * rate / 100 * (accruedDays / 365);
  if (a.manualInterest !== '' && a.manualInterest != null) {
    accruedInterest = Number(a.manualInterest) || 0;
  }
  const matured = viewDate >= end;
  return { currentValue: amt + accruedInterest, maturityValue, accruedInterest, matured };
}
function changeSavingsViewDate(delta) {
  savingsViewDate = addDays(savingsViewDate, delta);
  switchPage('finance','');
}

function saveSavingsAccount(idx) {
  const name = document.getElementById('saName').value.trim();
  if (!name) { showToast('请输入账户名称'); return; }
  const type = document.getElementById('saType').value;
  const amount = parseFloat(document.getElementById('saAmount').value) || 0;
  const note = document.getElementById('saNote').value.trim();
  if (!DB.savingsAccounts) DB.savingsAccounts = [];
  const startDate = type === 'time' ? (document.getElementById('saStartDate').value || '') : '';
  const maturityDate = type === 'time' ? (document.getElementById('saMaturityDate').value || '') : '';
  if (type === 'time' && startDate && maturityDate && maturityDate < startDate) { showToast('到期日不能早于起息日'); return; }
  const rate = type === 'time' ? (parseFloat(document.getElementById('saRate').value) || 0) : 0;
  const miRaw = type === 'time' ? document.getElementById('saInterest').value : '';
  const manualInterest = (miRaw === '' ? '' : (parseFloat(miRaw) || 0));
  if (idx !== null && idx !== undefined && DB.savingsAccounts[idx]) {
    const a = DB.savingsAccounts[idx];
    a.name = name; a.type = type; a.amount = amount; a.note = note;
    if (type === 'time') {
      a.startDate = startDate; a.maturityDate = maturityDate; a.rate = rate; a.manualInterest = manualInterest;
    } else {
      a.startDate = ''; a.maturityDate = ''; a.rate = 0; a.manualInterest = '';
    }
    saveDB(); closeModal(); switchPage('finance',''); showToast('账户已更新');
  } else {
    if (DB.savingsAccounts.find(x => x.name === name)) { showToast('该账户已存在'); return; }
    const acc = { name, type, amount, note };
    if (type === 'time') {
      acc.startDate = startDate; acc.maturityDate = maturityDate; acc.rate = rate; acc.manualInterest = manualInterest;
    }
    DB.savingsAccounts.push(acc);
    saveDB(); closeModal(); switchPage('finance',''); showToast('账户已添加');
  }
}

function deleteSavingsAccount(idx) {

}

function renderBudget() {
  const config = DB.financeConfig;
  const month = getMonth(today());
  const monthBills = DB.bills.filter(b => b.date.slice(0,7)===month && b.type==='expense');
  const cats = DB.expenseCategories;

  let html = `

      <button class="btn btn-outline btn-sm" onclick="addCategory()">+ 自定义分类</button>
    </div>`;

  cats.forEach(cat => {
    const budget = (config.budgets && config.budgets[cat]) ? config.budgets[cat] : 0;
    const spent = monthBills.filter(b => b.category===cat).reduce((s,b)=>s+b.amount, 0);
    const pct = budget > 0 ? Math.round(spent/budget*100) : 0;
    const isDanger = pct >= 100;
    const isWarning = pct >= 85 && pct < 100;
    const fillColor = isDanger ? 'budget-danger' : isWarning ? 'budget-warning' : '';

    html += `<div class="budget-bar">
      <div class="budget-bar-header">
        <span>${cat}</span>
        <span class="${isDanger?'text-red':isWarning?'text-yellow':''}">
          ¥${fmtMoney(spent)} / ¥${fmtMoney(budget || '—')}
          ${isDanger ? ' 🔴超支！' : isWarning ? ' ⚠️预警' : ''}
        </span>
      </div>
      <div class="budget-bar-track">
        <div class="budget-bar-fill ${fillColor}" style="width:${Math.min(100,pct)}%;background:${isDanger?'var(--red)':isWarning?'#f2cc8f':'var(--green-active)'}"></div>
      </div>
      <div class="flex-between text-sm text-light mt-8">
        <span>${pct}%</span>
        <span style="cursor:pointer;text-decoration:underline" onclick="setCategoryBudget('${cat}',${budget})">设置预算</span>
      </div>
    </div>`;
  });

  html += '</div>';
  return html;
}

const FLOW_OPTS  = ['未记录', '少', '中', '多'];
const PAIN_OPTS  = ['无痛', '轻微', '中度', '剧烈'];
const BODY_OPTS  = ['无', '腰酸', '腹胀', '乏力', '头痛', '恶心', '胸胀'];
const MOOD_OPTS  = ['😊 愉快', '😐 平静', '😔 低落', '😣 烦躁', '🥱 疲惫'];

function memoMod(key){ return MEMO_MODULES.find(m => m.key === key) || MEMO_MODULES[0]; }
function dateDiff(a,b){
  if (!a || !b) return null;
  return Math.floor((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function fmtCountdown(start){
  if (!start) return '未设置';
  const d = dateDiff(start, today());
  if (d === 0) return '就是今天';
  return d > 0 ? '已经 ' + d + ' 天' : '还有 ' + Math.abs(d) + ' 天';
}
function escapeAttr(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function memoRecs(cat){ return DB.memoData.records.filter(r => r.category === cat); }
let _uidSeq = 0;
function uid(prefix){ return prefix + '-' + Date.now().toString(36) + '-' + (++_uidSeq).toString(36) + Math.floor(Math.random()*1296).toString(36); }

/* 经期统计与预测 */
function periodStarts(){ return memoRecs('period').filter(r => r.start).map(r => r.start).sort(); }
function avgCycle(){
  const ps = periodStarts();
  if (ps.length < 2) return 28;
  const gaps = [];
  for (let i = 1; i < ps.length; i++) gaps.push(daysBetween(ps[i], ps[i-1]));
  return Math.max(15, Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length));
}
function avgPeriodLen(){
  const lens = memoRecs('period').filter(r => r.start && r.end).map(r => daysBetween(r.start, r.end) + 1);
  if (!lens.length) return 5;
  return Math.max(2, Math.round(lens.reduce((a,b)=>a+b,0)/lens.length));
}
function estimateNextPeriod(){
  const ps = periodStarts();
  if (!ps.length) return null;
  return addDays(ps[ps.length-1], ps.length === 1 ? 28 : avgCycle());
}
function periodOfDate(d){
  return memoRecs('period').find(r => {
    if (!r.start) return false;
    const end = r.end || addDays(r.start, avgPeriodLen() - 1);
    return daysBetween(r.start, d) >= 0 && daysBetween(d, end) >= 0;
  }) || null;
}
function periodSummary(r){
  const days = (r.start && r.end) ? daysBetween(r.start, r.end) + 1 : 0;
  const logs = r.days || {};
  const filled = Object.keys(logs).length;
  const pains = Object.values(logs).map(l => PAIN_OPTS.indexOf(l.pain)).filter(v => v > 0);
  const avgPain = pains.length ? PAIN_OPTS[Math.round(pains.reduce((a,b)=>a+b,0)/pains.length)] : null;
  return { days, filled, avgPain };
}
function periodMarkMap(){
  // 返回 { 'YYYY-MM-DD': 'period'|'predict'|'ovu-day'|'ovu' }
  const marks = {};
  memoRecs('period').forEach(r => {
    if (!r.start) return;
    let cur = r.start, guard = 0;
    let end = r.end || addDays(r.start, avgPeriodLen() - 1);
    // 保护：错误/超长的结束日自动截断到默认经期长度，避免整月全绿
    if (daysBetween(r.start, end) > 15) end = addDays(r.start, avgPeriodLen() - 1);
    while (daysBetween(end, cur) >= 0 && guard < 45) { marks[cur] = 'period'; cur = addDays(cur,1); guard++; }
  });
  const next = estimateNextPeriod();
  if (next) {
    const plen = avgPeriodLen();
    let cur = next, guard = 0;
    while (guard < plen) { if (!marks[cur]) marks[cur] = 'predict'; cur = addDays(cur,1); guard++; }
    const ovuDay = addDays(next, -14);
    if (!marks[ovuDay]) marks[ovuDay] = 'ovu-day';
    let oc = addDays(ovuDay, -5), g2 = 0;
    while (g2 < 10) { if (!marks[oc]) marks[oc] = 'ovu'; oc = addDays(oc,1); g2++; }
  }
  return marks;
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function weekdayCN(d){
  if (!d) return '';
  const w = new Date(d + 'T00:00:00').getDay();
  return ['日','一','二','三','四','五','六'][w] || '';
}

/* 经期记录主板块（类美柚） */
function renderPeriodModule(){
  const base = periodModuleDate;
  const y = +base.slice(0,4), m = +base.slice(5,7);
  const first = y + '-' + pad2(m) + '-01';
  const lead = new Date(first + 'T00:00:00').getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const marks = periodMarkMap();
  const todayStr = today();

  let html = '';

  /* 状态卡 */
  const cur = periodOfDate(todayStr);
  if (cur) {
    const dayNo = daysBetween(cur.start, todayStr) + 1;
    const len = cur.end ? (daysBetween(cur.start, cur.end) + 1) : 0;
    const lenLabel = cur.endPredicted ? '预计共' : '共';
    html += `<div class="period-status">
      <div class="ps-big">处于月经期 · 第 ${dayNo} 天</div>
      <div class="ps-sub">开始于 ${cur.start}${len ? ' · ' + lenLabel + ' ' + len + ' 天' : ' · 尚未结束'}</div>
      <div class="ps-meta">已记录 ${Object.keys(cur.days||{}).length} 天 · 记得每天打卡血量 / 疼痛</div>
    </div>`;
  } else {
    const next = estimateNextPeriod();
    if (!next) {
      html += `<div class="period-status">
        <div class="ps-big">记录你的第一次经期 🌸</div>
        <div class="ps-sub">点下方「标记开始」即可</div>
        <div class="ps-meta">之后会自动推算周期与下月预测</div></div>`;
    } else {
      const gap = daysBetween(next, todayStr);
      html += `<div class="period-status">
        <div class="ps-big">预计 ${next} 来下次</div>
        <div class="ps-sub">距离下次月经还有 <b>${gap}</b> 天 · 平均周期 ${avgCycle()} 天</div>
        <div class="ps-meta">点日历上的日期可补记当天情况</div></div>`;
    }
  }

  /* 月份切换 + 日历 */
  html += `<div class="card mt-16"><div class="period-cal-header">
    <button class="btn-icon" onclick="changePeriodMonth(-1)" title="上个月">◀</button>
    <div class="period-cal-title">${y} 年 ${m} 月<span class="period-cur-pill">${weekdayCN(todayStr)} ${todayStr.slice(5)}</span></div>
    <button class="btn-icon" onclick="changePeriodMonth(1)" title="下个月">▶</button>
  </div>`;
  html += `<div class="period-legend">
    <span><i class="period"></i>经期</span>
    <span><i class="predict"></i>预测经期</span>
    <span><i class="ovu-day"></i>排卵日</span>
    <span><i class="ovu"></i>排卵期</span>
  </div>`;

  html += '<div class="period-calendar">';
  ['日','一','二','三','四','五','六'].forEach(w => html += '<div class="period-cal-weekday">' + w + '</div>');
  for (let i = 0; i < lead; i++) html += '<div class="period-cal-day empty"></div>';
  for (let dd = 1; dd <= daysInMonth; dd++) {
    const ds = y + '-' + pad2(m) + '-' + pad2(dd);
    const cls = ['period-cal-day'];
    if (marks[ds]) cls.push(marks[ds]);
    if (ds === todayStr) cls.push('today');
    if (ds === periodSelectedDay) cls.push('selected');
    const rec = periodOfDate(ds);
    const log = rec && rec.days ? rec.days[ds] : null;
    const mark = log && log.flow && log.flow !== '未记录' ? '●' : '';
    html += '<div class="' + cls.join(' ') + '" onclick="periodPickDay(\'' + ds + '\')"><span class="num">' + dd + '</span>' + (mark ? '<span class="mark">' + mark + '</span>' : '') + '</div>';
  }
  html += '</div>';

  html += '</div>';

  /* 日历下方：当天记录面板 */
  html += renderPeriodDayPanel();

  /* 历史经期 */
  const history = memoRecs('period').slice().sort((a,b) => (b.start||'').localeCompare(a.start||''));
  html += `<div class="card mt-16"><div class="section-header"><h3>📚 历史经期</h3><span class="text-sm text-gray">共 ${history.length} 次</span></div>`;
  if (!history.length) html += '<div class="empty-state"><span class="emoji">🌸</span>暂无历史经期记录</div>';
  else history.forEach(r => {
    const s = periodSummary(r);
    const days = Object.values(r.days || {});
    const maxPain = days.map(l => PAIN_OPTS.indexOf(l.pain)).filter(v => v > 0);
    const worstPain = maxPain.length ? PAIN_OPTS[Math.max(...maxPain)] : null;
    const bodies = [...new Set(days.map(l => l.body).filter(b => b && b !== '无'))];
    const notes = days.map(l => l.note).filter(Boolean);
    html += `<div class="memo-card">
      <div class="flex-between">
        <div><div class="period-history-date">🌸 ${r.start}${r.end && r.end !== r.start ? ' ~ ' + r.end : (!r.end ? ' ~ 进行中' : '')}</div>
        <div class="period-history-meta">共 ${r.end ? s.days : '进行中'} 天 · 已记录 ${s.filled} 天${worstPain ? ' · 最痛「' + worstPain + '」' : ''}</div></div>
        <div class="flex-row gap-sm">
          <button class="btn-icon btn-sm" onclick="openPeriodEditor('${r.id}')" title="编辑">✏️</button>
          <button class="btn-icon btn-sm" onclick="deleteMemoRecord('${r.id}')" title="删除">🗑</button>
        </div>
      </div>
      ${bodies.length ? '<div class="mt-4">' + bodies.map(b => '<span class="memo-tag" style="background:#e8f0e4;color:#5f8c7c">' + b + '</span>').join(' ') + '</div>' : ''}
      ${notes.length ? '<div class="memo-card-body">说明：' + escapeHTML(notes.join('；')) + '</div>' : ''}
    </div>`;
  });
  html += '</div>';
  return html;
}
function changePeriodMonth(delta){
  let y = +periodModuleDate.slice(0,4), m = +periodModuleDate.slice(5,7) + delta;
  if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
  periodModuleDate = y + '-' + pad2(m) + '-01';
  renderPage('memo','');
}
function periodQuickStart(){

}
function periodPickDay(ds){

}
function getPeriodActionState(){
  const d = periodSelectedDay || today();
  const cur = periodOfDate(d);
  if (!cur) return 'start';
  if (cur.start === d) return 'cancel';
  if (cur.endPredicted) return 'end';
  return 'cancel';
}
function periodActionButtonHTML(){
  const st = getPeriodActionState();
  const cls = st === 'start' ? 'btn-primary' : 'btn-outline';
  const extra = st === 'cancel' ? ' period-action-cancel' : '';
  const txt = st === 'start' ? '标记开始' : (st === 'end' ? '标记结束' : '取消标记');
  return `<button class="btn ${cls} btn-sm period-action-pill${extra}" onclick="periodActionClick()">${txt}</button>`;
}
function periodActionClick(){
  const st = getPeriodActionState();
  if (st === 'start') markPeriodStart();
  else if (st === 'end') markPeriodEnd();
  else cancelPeriodMark();
}
function cancelPeriodMark(){
  const d = periodSelectedDay || today();
  const cur = periodOfDate(d);
  if (!cur) return;
  if (confirm('确定取消这次经期标记吗？')) {
    DB.memoData.records = DB.memoData.records.filter(r => r.id !== cur.id);
    saveDB(); renderPage('memo',''); showToast('已取消标记');
  }
}

  const painIcon = o => o === '无痛' ? '' : '⚡ ';
  const moodIcon = o => o.startsWith('😊') ? '' : o.startsWith('😐') ? '' : o.startsWith('😔') ? '' : o.startsWith('😣') ? '' : o.startsWith('🥱') ? '' : '';
  return `<div class="card mt-16 period-edit-panel">

      <label>经血量</label>
      <div class="period-chip-group">${chip('pedFlow', FLOW_OPTS, log.flow, flowIcon)}</div>

    </div>
    <div class="period-edit-section">
      <label>痛经等级</label>
      <div class="period-chip-group">${chip('pedPain', PAIN_OPTS, log.pain, painIcon)}</div>
      <input type="hidden" id="pedPain" value="${escapeAttr(log.pain || PAIN_OPTS[0])}">
    </div>
    <div class="period-edit-section">
      <label>身体不适</label>
      <div class="period-chip-group">${chip('pedBody', BODY_OPTS, log.body)}</div>
      <input type="hidden" id="pedBody" value="${escapeAttr(log.body || BODY_OPTS[0])}">
    </div>
    <div class="period-edit-section">
      <label>当日心情</label>
      <div class="period-chip-group">${chip('pedMood', MOOD_OPTS, log.mood, moodIcon)}</div>

    </div>

      <label>补充说明</label>
      <input type="text" id="pedNote" class="period-edit-note" value="${escapeAttr(log.note || '')}" placeholder="选填，例如：喝了红糖水后好转">
    </div>

      ${!cur ? '<span class="text-sm text-gray">保存后将从 ' + d + ' 开始记录经期</span>' : ''}
      <button class="btn btn-outline btn-sm" onclick="periodSelectedDay=null;renderPage('memo','')">收起</button>
      <button class="btn btn-primary btn-sm" onclick="savePeriodDay()">保存记录</button>

  </div>`;
}
function setPeriodChip(inputId, value, btn){
  const input = document.getElementById(inputId);
  if (input) input.value = value;
  const container = btn.parentElement;
  if (container) Array.from(container.children).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function markPeriodStart(){
  const d = periodSelectedDay || today();
  const ongoing = memoRecs('period').find(r => r.start && (!r.end || r.endPredicted));
  if (ongoing) { showToast('已有进行中的经期，请先标记结束'); return; }
  const existing = periodOfDate(d);
  if (existing) { showToast('该日期已在经期记录中'); return; }
  const len = avgPeriodLen();
  const projectedEnd = addDays(d, len - 1);
  DB.memoData.records.push({ id: uid('rec'), category:'period', start:d, end:projectedEnd, endPredicted:true, days:{}, time:Date.now() });
  saveDB(); renderPage('memo',''); showToast('已标记经期开始（预计 ' + len + ' 天）');
}
function markPeriodEnd(){
  const d = periodSelectedDay || today();
  let cur = memoRecs('period').find(r => r.start && r.endPredicted);
  if (!cur) cur = periodOfDate(d);
  if (!cur) { showToast('当前没有可结束的经期'); return; }
  if (daysBetween(cur.start, d) < 0) { showToast('结束日期不能早于开始日期'); return; }
  cur.end = d;
  cur.endPredicted = false;
  saveDB(); renderPage('memo',''); showToast('已标记经期结束');
}
function savePeriodDay(){
  const d = periodSelectedDay;
  if (!d) return;
  let r = periodOfDate(d);
  const isNew = !r;
  if (!r) {
    const projectedEnd = addDays(d, avgPeriodLen() - 1);
    r = { id: uid('rec'), category:'period', start:d, end:projectedEnd, endPredicted:true, days:{}, time:Date.now() };
    DB.memoData.records.push(r);
  }
  r.days = r.days || {};
  const log = {
    flow: document.getElementById('pedFlow').value,
    pain: document.getElementById('pedPain').value,
    body: document.getElementById('pedBody').value,
    mood: document.getElementById('pedMood').value,
    note: document.getElementById('pedNote').value.trim()
  };
  if (log.flow === FLOW_OPTS[0] && log.pain === PAIN_OPTS[0] && log.body === BODY_OPTS[0] && !log.note) delete r.days[d];
  else r.days[d] = log;
  saveDB(); renderPage('memo',''); showToast(isNew ? '经期已开始记录' : '记录已保存');
}

    </div>

    <div class="modal-footer">

      <button class="btn btn-primary" onclick="savePeriod('${id}')">保存</button>

/* 恋爱日记照片：上传 / 预览 / 删除（压缩后存 base64） */
function renderLovePhotoDrafts(){
  return lovePhotoDraft.map((src, i) =>
    `<div class="love-photo"><img src="${src}" alt=""><span class="love-photo-del" onclick="removeLovePhotoDraft(${i})">✕</span></div>`
  ).join('');
}
function pickLovePhotos(){ document.getElementById('lovePhotoInput').click(); }
function handleLovePhotos(files){
  const remain = 6 - lovePhotoDraft.length;
  const arr = [...files].slice(0, remain);
  if (remain <= 0) { showToast('最多 6 张照片'); }
  let pending = arr.length;
  if (!pending) return;
  arr.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => compressImage(e.target.result, 900, dataUrl => {
      lovePhotoDraft.push(dataUrl);
      pending--;
      if (pending === 0) refreshMemoBody();
    });
    reader.readAsDataURL(f);
  });
}
function removeLovePhotoDraft(i){ lovePhotoDraft.splice(i, 1); refreshMemoBody(); }
function compressImage(dataUrl, maxW, cb){
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, maxW / img.width);
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    // 质量逐步压缩，控制在 ~250KB 内
    let q = 0.85, out = c.toDataURL('image/jpeg', q);
    while (out.length > 250000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
    cb(out);
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}
function renderLovePhotos(record){
  if (!record.photos || !record.photos.length) return '';
  return `<div class="love-photos mt-8">` + record.photos.map(src =>

  if (r.category === 'period') { openPeriodEditor(id); return; }
  memoEditDate = r.date || today();
  if (!keepDraft) editPhotoDraft = (r.category === 'love' ? (r.photos || []).slice() : []);

  renderEditModal(id);
}
function renderEditModal(id){
  const r = DB.memoData.records.find(x => x.id === id);

  let fields = '';
  if (r.category === 'password') {
    fields = `<div class="mb-12"><label class="text-sm text-gray">名称</label><input type="text" id="emTitle" value="${escapeAttr(r.title)}" style="margin-top:4px"></div>

        <button class="btn btn-outline btn-sm mt-8" onclick="pickEditPhotos()">📷 替换 / 追加照片</button>
        <input type="file" id="emPhotoInput" accept="image/*" multiple style="display:none" onchange="handleEditPhotos(this.files)"></div>`;
    }

      `<div class="mb-12"><label class="text-sm text-gray">标题</label><input type="text" id="emTitle" value="${escapeAttr(r.title)}" style="margin-top:4px"></div>
       <div class="mb-12"><label class="text-sm text-gray">内容</label><textarea id="emContent" rows="${r.category === 'love' ? 5 : 3}" style="margin-top:4px">${escapeHTML(r.content || '')}</textarea></div>` + extra;
  }
  showModal(`<div class="modal-title">编辑${m.name}</div>

    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveMemoRecordEdit('${id}')">保存</button></div>`);
  if (memoEditCache && memoEditCache.id === id) {
    const set = (elId, v) => { const e = document.getElementById(elId); if (e && v != null) e.value = v; };
    set('emTitle', memoEditCache.title);
    set('emContent', memoEditCache.content);
    set('emAccount', memoEditCache.account);

    set('emSubtype', memoEditCache.subtype);

    memoEditCache = null;
  }
}
function cacheEditFields(id){
  const g = elId => { const e = document.getElementById(elId); return e ? e.value : null; };
  memoEditCache = { id, title:g('emTitle'), content:g('emContent'), account:g('emAccount'), password:g('emPassword'), subtype:g('emSubtype'), mood:g('emMood') };
}
/* 编辑弹窗：照片管理 */
function pickEditPhotos(){ document.getElementById('emPhotoInput').click(); }
function handleEditPhotos(files){
  const remain = 6 - editPhotoDraft.length;
  const arr = [...files].slice(0, remain);
  if (!arr.length) return;
  let pending = arr.length;
  arr.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => compressImage(e.target.result, 900, dataUrl => {
      editPhotoDraft.push(dataUrl); pending--; if (pending === 0) renderEditModalFromDraft();
    });
    reader.readAsDataURL(f);
  });
}
function removeEditPhoto(i){ editPhotoDraft.splice(i, 1); renderEditModalFromDraft(); }
function renderEditModalFromDraft(){
  // 重新渲染当前打开的编辑弹窗，保留已填内容
  const id = currentEditId;
  if (!id) return;
  const r = DB.memoData.records.find(x => x.id === id);
  if (!r) return;
  const title = document.getElementById('emTitle');
  const content = document.getElementById('emContent');
  const mood = document.getElementById('emMood');
  memoEditCache = {
    id,
    title: title ? title.value : r.title,
    content: content ? content.value : r.content,
    account: null, password: null, subtype: null,
    mood: mood ? mood.value : r.mood
  };
  editMemoRecord(id, true);
}
function saveMemoRecordEdit(id){
  const r = DB.memoData.records.find(x => x.id === id);
  if (!r) return;
  const g = elId => { const e = document.getElementById(elId); return e ? e.value : undefined; };
  r.date = memoEditDate;
  r.title = (g('emTitle') || '').trim();
  r.content = g('emContent') || '';
  if (r.category === 'password') { r.account = (g('emAccount') || '').trim(); r.password = g('emPassword') || ''; }
  if (r.category === 'memo') r.subtype = readMemoSubtype('emSubtype');
  if (r.category === 'love') { r.mood = g('emMood'); if (typeof editPhotoDraft !== 'undefined') r.photos = editPhotoDraft.slice(); }
  currentEditId = null;
  editPhotoDraft = [];
  saveDB(); closeModal(); renderPage('memo',''); showToast('已更新');
}
function deleteMemoRecord(id){
  const r = DB.memoData.records.find(x => x.id === id);

function editCountdown(id){
  const c = DB.memoData.countdowns.find(x => x.id === id);

  if (countdownEditingId !== id) { countdownEntryDate = c.startDate || today(); countdownTitleCache = c.title; }

  showModal(`<div class="modal-title">编辑计时卡片</div>
    <div class="mb-12"><label class="text-sm text-gray">卡片标题</label><input type="text" id="cdTitle" value="${escapeAttr(countdownTitleCache)}" style="margin-top:4px"></div>
    <div class="mb-12"><label class="text-sm text-gray">目标 / 起始日期</label><br>
      <button class="btn btn-outline btn-sm mt-4" onclick="countdownTitleCache=document.getElementById('cdTitle').value; openDatePicker(countdownEntryDate, function(v){ countdownEntryDate=v; editCountdown('${id}'); })">📅 ${countdownEntryDate}</button></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveCountdown('${id}')">保存</button></div>`);

function saveCountdown(id){
  const title = document.getElementById('cdTitle').value.trim();
  if (!title) { showToast('请输入卡片标题'); return; }
