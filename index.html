/* 日期工具 */
function today() { return new Date().toISOString().slice(0,10); }
/* 金额千分位格式化（保留两位小数） */
function fmtMoney(n) {
  const v = Number(n);
  if (!isFinite(v)) return '0.00';
  return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtMoneyInt(n) {
  return String(Math.round(Number(n) || 0));
}
function formatDate(d) {
  const dt = d instanceof Date ? d : new Date(d);
  return dt.toISOString().slice(0,10);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr);
  d.setDate(d.getDate()+n);
  return formatDate(d);
}
function getMonth(dateStr) { return dateStr ? dateStr.slice(0,7) : today().slice(0,7); }

/* Toast */
function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* 模态框 */
function showModal(html) {
  const overlay = document.getElementById('modalOverlay');
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
/* 二次确认弹窗（防误触）：点击确定才执行 onYes */
function confirmAction(msg, onYes) {
  window._confirmCb = onYes;
  showModal(`<div class="modal-title">提示</div>
    <div class="modal-body text-center" style="padding:18px 8px;font-size:15px;color:var(--text-main)">${msg}</div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-danger" onclick="closeModal();window._confirmCb&&window._confirmCb()">确定删除</button>
    </div>`);
}

/* ===== 通用日期选择器：点日期即生效（无"设置"确认键）；右上角 🔍 可跳转到任意年月日 ===== */
let datePickerY = 2026, datePickerM = 8, datePickerOnPick = null;

function openDatePicker(initialDate, onPick) {
  const [y, m] = (initialDate && initialDate.length >= 7 ? initialDate : today()).split('-').map(Number);
  datePickerY = y; datePickerM = m; datePickerOnPick = onPick;
  renderDatePicker();
}
function renderDatePicker() {
  const y = datePickerY, m = datePickerM;
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDay = new Date(y, m - 1, 1).getDay();
  const wd = ['日','一','二','三','四','五','六'];
  const td = today();
  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    cells += `<div class="streak-cell ${ds===td?'today':''}" onclick="pickDateFromPicker('${ds}')" style="cursor:pointer"><span>${d}</span></div>`;
  }
  showModal(`
    <div class="flex-between mb-12">
      <div class="modal-title">选择日期</div>
      <button class="btn-icon btn-sm" onclick="toggleDatePickerJump()" aria-label="跳转到指定日期">🔍</button>
    </div>
    <div id="datePickerJumpRow" style="display:none" class="mb-12">
      <label class="text-sm text-gray">跳转到指定年月日（可手动输入，或选下方日期）</label>
      <div class="flex-row gap-sm mt-8" style="align-items:flex-end;flex-wrap:wrap">
        <div><div class="text-sm text-gray">年</div><input type="number" id="dpJumpY" value="${datePickerY}" style="width:84px;margin-top:2px"></div>
        <div><div class="text-sm text-gray">月</div><input type="number" id="dpJumpM" value="${String(datePickerM).padStart(2,'0')}" min="1" max="12" style="width:64px;margin-top:2px"></div>
        <div><div class="text-sm text-gray">日</div><input type="number" id="dpJumpD" value="1" min="1" max="31" style="width:64px;margin-top:2px"></div>
        <button class="btn btn-primary btn-sm" onclick="jumpDateByInput()">跳转</button>
      </div>
    </div>
    <div class="flex-between mb-12">
      <button class="btn-icon btn-sm" onclick="changeDatePickerMonth(-1)">◀</button>
      <span class="font-semi">${y} 年 ${String(m).padStart(2,'0')} 月</span>
      <button class="btn-icon btn-sm" onclick="changeDatePickerMonth(1)">▶</button>
    </div>
    <div class="cal-grid">${wd.map(w => `<div class="cal-dow">${w}</div>`).join('')}${cells}</div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="pickDateFromPicker(today())">今天</button>
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
    </div>
  `);
}
function pickDateFromPicker(ds) {
  closeModal();   // 先关闭日期选择器，避免后续重开弹窗被立即关掉
  if (datePickerOnPick) datePickerOnPick(ds);
}
function changeDatePickerMonth(delta) {
  let y = datePickerY, m = datePickerM;
  m += delta;
  if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
  datePickerY = y; datePickerM = m;
  renderDatePicker();
}
function toggleDatePickerJump() {
  const row = document.getElementById('datePickerJumpRow');
  if (!row) return;
  row.style.display = (row.style.display === 'none') ? 'block' : 'none';
}
function jumpDateByInput() {
  let y = parseInt(document.getElementById('dpJumpY').value, 10);
  let m = parseInt(document.getElementById('dpJumpM').value, 10);
  let d = parseInt(document.getElementById('dpJumpD').value, 10);
  if (!y || y < 1) y = datePickerY;
  if (!m || m < 1) m = 1; if (m > 12) m = 12;
  const dim = new Date(y, m, 0).getDate();
  if (!d || d < 1) d = 1; if (d > dim) d = dim;
  datePickerY = y; datePickerM = m;
  pickDateFromPicker(y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'));
}

/* 导航 */
function switchPage(page, subpage) {

    const navItem = document.querySelector(`.nav-item[data-page="${page}"]`);

    if (subpage) {
      const subItem = document.querySelector(`.nav-sub-item[data-subpage="${subpage}"]`);
      if (subItem) subItem.classList.add('active');
      const subsubItem = document.querySelector(`.nav-subsub-item[data-subpage="${subpage}"]`);
      if (subsubItem) subsubItem.classList.add('active');
    }

    const titles = { home:'首页', todo:'今日待办', goal:'学习目标管理台', english:'英语学习', fitness:'健身减重', finance:'财务管理', memo:'生活记事馆' };
    const tb = document.getElementById('topbarTitle');
    if (tb) tb.textContent = titles[subpage] || titles[page] || '';

    renderPage(page, subpage);
    closeSidebar();
  } catch (e) {
    console.error('[switchPage] 切换失败:', page, subpage, e);
    const area = document.getElementById('contentArea');
    if (area) area.innerHTML = `<div class="card" style="padding:20px"><h3>页面切换出错</h3><p class="text-sm text-gray">请按 F12 打开控制台，把红色报错截图给开发者。</p><p class="text-sm text-gray">错误：${escapeHTML(e.message)}</p></div>`;
    closeSidebar();
  }
}

}

function toggleSubmenu(el) {

function renderMoodChart(data) {
  const container = document.getElementById('moodChart');
  if (!container) return;
  const moodMap = { '开心':5, '平静':4, '疲惫':3, '焦虑':2, '低落':1 };
  const width = container.offsetWidth || 600;
  const h = 160;
  const barW = Math.min(50, (width - 40) / 7 - 8);
  const gap = (width - 40 - barW*7) / 6;
  const colors = { 5:'#7ba89a', 4:'#9fbfb2', 3:'#f2cc8f', 2:'#e07a5f', 1:'#cc6b5d' };
  let svg = `<svg width="100%" height="${h+30}" viewBox="0 0 ${width} ${h+30}">`;
  // 基线
  svg += `<line x1="30" y1="${h}" x2="${width-10}" y2="${h}" stroke="#d4e0cc" stroke-width="1"/>`;
  data.forEach((d, i) => {
    const x = 30 + i * (barW + gap);
    const val = d.mood ? (moodMap[d.mood] || 3) : 0;
    const barH = val > 0 ? (val / 5) * (h - 30) : 0;
    const y = h - barH;
    const color = colors[val] || '#ddd';
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="${color}" opacity="${d.mood ? 1 : 0.15}"/>`;
    if (d.mood) {
      svg += `<text x="${x + barW/2}" y="${y - 5}" text-anchor="middle" font-size="10" fill="#555">${d.mood}</text>`;
    }
    const label = d.date.slice(5);
    svg += `<text x="${x + barW/2}" y="${h + 15}" text-anchor="middle" font-size="9" fill="#888">${label}</text>`;
  });
  svg += `</svg>`;
  container.innerHTML = svg;
}

/* AI 搜索 */
function aiSearch() {
  const input = document.getElementById('aiSearchInput');
  const q = input.value.trim();
  const resultsEl = document.getElementById('aiSearchResults');
  if (!q) { resultsEl.innerHTML = ''; return; }
  const results = [];
  const ql = q.toLowerCase();
  
  // 搜待办
  DB.todos.forEach(td => {
    if (td.text.toLowerCase().includes(ql) || td.date.includes(q)) {
      results.push({ type:'待办', tag:'待办', content: td.text, date: td.date, extra: td.done ? '已完成' : '未完成' });
    }
  });
  // 搜心情日记
  Object.entries(DB.moods).forEach(([d, entry]) => {
    if (entry.note && entry.note.toLowerCase().includes(ql) || entry.mood.includes(q)) {
      results.push({ type:'日记', tag:'日记', content: entry.mood + ' ' + (entry.note||''), date: d });
    }
  });
  // 搜错题本
  DB.englishData.errorBook.forEach((e, i) => {
    if (e.content.toLowerCase().includes(ql)) {
      results.push({ type:'错题', tag:'错题('+e.type+')', content: e.content, date: e.date, extra: e.analysis });
    }
  });
  // 搜账单
  DB.bills.forEach(b => {
    if (b.note && b.note.toLowerCase().includes(ql) || b.category.includes(q) || String(b.amount).includes(q)) {
      results.push({ type:'账单', tag:'账单('+b.type+')', content: b.category+' ¥'+b.amount+' '+(b.note||''), date: b.date });
    }
  });
  // 搜英语笔记
  if (DB.englishData.notes.toLowerCase().includes(ql)) {
    results.push({ type:'笔记', tag:'备考笔记', content: '备考笔记中匹配到关键词', date: '' });
  }

  let html = `<div class="ai-search-results"><div class="card-title">🔍 搜索结果（${results.length}条）</div>`;
  if (results.length === 0) {
    html += '<div class="empty-state"><span class="emoji">🔍</span>未找到匹配记录</div>';
  } else {
    const tagColors = { '待办':'#9fbfb2', '日记':'#f2cc8f', '错题':'#e07a5f', '账单':'#81b29a', '笔记':'#7ba89a' };
    results.forEach(r => {
      html += `<div class="search-result-item">
        <span class="search-result-tag" style="background:${tagColors[r.type]||'#ccc'}">${r.tag}</span>
        <span class="text-gray">${r.date || ''}</span> ${r.content}
        ${r.extra ? '<br><span class="text-sm text-light">'+r.extra+'</span>' : ''}
      </div>`;
    });
  }
  html += '</div>';
  resultsEl.innerHTML = html;
}

/* 习惯打卡 */
function renderHabitTracker(date) {
  const habits = DB.habits || [];
  let html = `<div class="card">
    <div class="section-header">
      <h3>✅ 长期习惯打卡</h3>
      <button class="btn btn-primary btn-sm" onclick="openHabitModal()">+ 添加习惯</button>
    </div>`;
  if (habits.length === 0) {
    html += '<div class="empty-state"><span class="emoji">✅</span>还没有习惯任务，点击右上角添加</div>';
  } else {
    html += '<div style="display:grid;gap:12px">';
    habits.forEach((h, idx) => {
      // 统计连续打卡天数（从今天往前）
      let streak = 0;
      let checkDate = today();
      while (DB.habitLogs[checkDate] && DB.habitLogs[checkDate].includes(h.name)) { streak++; checkDate = addDays(checkDate, -1); }
      // 累计天数
      let totalDays = 0;
      Object.entries(DB.habitLogs).forEach(([d, logs]) => { if (logs.includes(h.name)) totalDays++; });
      // 重复周期文案
      const repeatLabel = (h.repeat === 'weekly') ? '每周'
        : (h.repeat || '').startsWith('weekcount:') ? '本周' + h.repeat.split(':')[1] + '次'
        : (h.repeat || '').startsWith('days:') ? '每周' + h.repeat.split(':')[1].split(',').map(i => ['日','一','二','三','四','五','六'][i]).join('')
        : ((h.repeat || '').startsWith('custom:') ? '每' + h.repeat.split(':')[1] + '天' : '每天');

      html += `<div class="list-item" ondblclick="editHabit(${idx})" title="双击编辑" style="border:1px solid var(--border-color);padding:10px 12px;border-radius:var(--radius-sm);align-items:flex-start;flex-direction:column">

            <div class="font-semi">${h.name}</div>
            <div class="text-sm text-gray">🔥 连续 ${streak} 天 · 累计 ${totalDays} 天${repeatLabel !== '每天' ? ' · 🔁 ' + repeatLabel : ''}</div>
          </div>
          <div class="flex-row gap-sm">
            <button class="btn-icon btn-sm" onclick="deleteHabit(${idx})" title="删除" aria-label="删除习惯">🗑</button>
          </div>
        </div>
        ${renderHabitHeatmap(h.name, idx)}
      </div>`;
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// 打卡视图（只读）：本周 周一到周日 7 个圆框，是否点亮取决于对应待办是否完成
function renderHabitHeatmap(name, idx) {
  const wd = ['日','一','二','三','四','五','六'];
  const hb = (DB.habits||[])[idx];
  const daysSet = (hb && hb.repeat && hb.repeat.startsWith('days:')) ? hb.repeat.split(':')[1].split(',').map(Number) : null;
  const now = new Date(today() + 'T00:00:00');
  const dow = now.getDay(); // 0=周日 .. 6=周六
  const mondayOffset = (dow === 0 ? -6 : 1 - dow);
  const monday = addDays(today(), mondayOffset);
  let html = '<div class="streak-week">';
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const checked = DB.habitLogs[d] && DB.habitLogs[d].includes(name);
    const wdi = new Date(d + 'T00:00:00').getDay();
    const off = daysSet && !daysSet.includes(wdi); // 自定义星期：非打卡日灰显
    const cls = checked ? 'checked' : (off ? 'empty off' : 'empty');
    const label = checked ? ' 已打卡' : '';
    const title = off ? `${d} 周${wd[wdi]}（非打卡日）` : `${d} 周${wd[wdi]}${label}`;
    html += `<div class="streak-cell ${cls}" title="${title}"><span>${wd[wdi]}</span></div>`;
  }
  html += '</div>';
  return html;
}

  if (!habitHistoryMonth) habitHistoryMonth = today().slice(0, 7);
  let [y, m] = habitHistoryMonth.split('-').map(Number);
  m += delta;
  if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
  habitHistoryMonth = y + '-' + String(m).padStart(2, '0');
  renderHabitHistoryModal(idx);

function saveHabit(idx) {
  const name = document.getElementById('habitName').value.trim();
  if (!name) { showToast('请输入习惯名称'); return; }
  let repeat = document.getElementById('habitRepeat').value;
  if (repeat === 'days') {
    const chk = [...document.querySelectorAll('#habitDaysWrap input:checked')].map(c => c.value);
    if (!chk.length) { showToast('请至少选择一天'); return; }
    repeat = 'days:' + chk.join(',');
  } else if (repeat === 'weekcount') {
    const n = parseInt(document.getElementById('habitWeekCount').value) || 0;
    if (n <= 0) { showToast('请输入有效的本周次数'); return; }
    repeat = 'weekcount:' + n;
  } else if (repeat === 'custom') {
    const days = parseInt(document.getElementById('habitCustomDays').value) || 0;
    if (days <= 0) { showToast('请输入有效的间隔天数'); return; }
    repeat = 'custom:' + days;
  }
  if (!DB.habits) DB.habits = [];

  if (idx !== null && idx !== undefined && DB.habits[idx]) {
    // 编辑模式
    const h = DB.habits[idx];
    const oldName = h.name;
    if (name !== oldName) {
      // 迁移历史打卡记录中的名称，避免改名后断签
      Object.keys(DB.habitLogs).forEach(d => {
        const i = DB.habitLogs[d].indexOf(oldName);
        if (i >= 0) {
          DB.habitLogs[d].splice(i, 1);
          if (!DB.habitLogs[d].includes(name)) DB.habitLogs[d].push(name);
          if (DB.habitLogs[d].length === 0) delete DB.habitLogs[d];
        }
      });
      // 同步改名由该习惯自动生成的待办，避免打卡记录失联
      DB.todos.forEach(t => { if (t.habitRef === oldName) t.habitRef = name; });
    }
    h.name = name; h.repeat = repeat;
    saveDB(); closeModal(); renderPage('todo',''); showToast('习惯已更新');
  } else {
    // 新增模式
    if (DB.habits.find(h => h.name === name)) { showToast('该习惯已存在'); return; }
    DB.habits.push({ name, repeat, createdAt: today() });
    saveDB(); closeModal(); renderPage('todo',''); showToast('习惯已添加');
  }
}

function deleteHabit(idx) {
  const h = (DB.habits||[])[idx];
  if (!h) return;
  confirmAction('确定要删除此项吗？', () => {
    // 同步清理该习惯的历史打卡记录
    Object.keys(DB.habitLogs).forEach(d => {
      DB.habitLogs[d] = DB.habitLogs[d].filter(n => n !== h.name);
      if (DB.habitLogs[d].length === 0) delete DB.habitLogs[d];
    });
    // 移除由该习惯自动生成的待办（不牵连用户手动新建的普通待办）
    DB.todos = DB.todos.filter(t => t.habitRef !== h.name);
    DB.habits.splice(idx, 1);
    saveDB();
    renderPage('todo','');
  });
}

/* ===== 习惯 ↔ 待办 自动联动 =====
   - 习惯按重复周期到点时，自动生成一条 habitRef=习惯名 的待办
   - 该待办被完成时，自动点亮习惯对应日期（写入 DB.habitLogs）
   - 取消完成则自动熄灭（不再手动打卡） */

// 本周（周一~周日）的起止日期
function weekRange(date) {
  const dow = new Date(date + 'T00:00:00').getDay(); // 0=周日 .. 6=周六
  const monday = addDays(date, dow === 0 ? -6 : 1 - dow);
  return { monday, sunday: addDays(monday, 6) };
}
// 某习惯本周已点亮（已完成）的天数
function weekDoneCount(h, date) {
  const { monday, sunday } = weekRange(date);
  let n = 0;
  for (let d = monday; d <= sunday; d = addDays(d, 1)) {
    if (DB.habitLogs[d] && DB.habitLogs[d].includes(h.name)) n++;
  }
  return n;
}

// 判断某习惯在指定日期是否需要打卡（date 需 >= createdAt）
function isHabitDue(h, date) {
  if (!h || !h.repeat) return false;
  if (date < (h.createdAt || date)) return false; // 创建日之前不生成
  const dow = new Date(date + 'T00:00:00').getDay(); // 0=周日 .. 6=周六
  if (h.repeat === 'daily') return true;
  if (h.repeat === 'weekly') {
    const cdow = new Date((h.createdAt || date) + 'T00:00:00').getDay();
    return dow === cdow;
  }
  if (h.repeat.startsWith('custom:')) { // 旧：每隔 N 天
    const n = parseInt(h.repeat.split(':')[1]) || 1;
    return daysBetween(h.createdAt || date, date) % n === 0;
  }
  if (h.repeat.startsWith('days:')) {
    const set = h.repeat.split(':')[1].split(',').map(Number);
    return set.includes(dow);
  }
  if (h.repeat.startsWith('weekcount:')) { // 自定义总天数：本周内每天显示，凑够次数后本周隐藏
    const N = parseInt(h.repeat.split(':')[1]) || 1;
    const { monday, sunday } = weekRange(date);
    if (date < monday || date > sunday) return false; // 仅本周内
    return weekDoneCount(h, date) < N;
  }
  return false;
}

// 自动把到点习惯生成为当日待办（已存在则跳过；与历史打卡记录保持一致）
function ensureHabitTodos(date) {
  if (!DB.habits || !DB.habits.length) return;
  let changed = false;
  DB.habits.forEach(h => {
    if (!isHabitDue(h, date)) return;
    const existing = DB.todos.find(t => t.habitRef === h.name && t.date === date);
    const alreadyLit = DB.habitLogs[date] && DB.habitLogs[date].includes(h.name);
    if (!existing) {
      DB.todos.push({
        id: uid('td'),
        text: h.name,
        priority: 'normal',
        repeat: '',
        done: !!alreadyLit,
        undone: false,
        date: date,
        habitRef: h.name
      });
      changed = true;
    } else if (existing.done !== !!alreadyLit) {
      existing.done = !!alreadyLit; // 与已有打卡记录对齐（例如改名前遗留）
      changed = true;
    }
  });
  if (changed) saveDB();
}

// 依据该习惯当天待办的完成状态，点亮 / 熄灭对应日期
function syncHabitLog(name, date) {
  if (!name) return;
  const lit = DB.todos.some(t => t.habitRef === name && t.date === date && t.done);
  if (!DB.habitLogs) DB.habitLogs = {};
  if (!DB.habitLogs[date]) DB.habitLogs[date] = [];
  const i = DB.habitLogs[date].indexOf(name);
  if (lit && i < 0) DB.habitLogs[date].push(name);
  else if (!lit && i >= 0) DB.habitLogs[date].splice(i, 1);
  if (DB.habitLogs[date].length === 0) delete DB.habitLogs[date];
}

    // 循环任务完成时生成下期
    if (t.done && t.repeat) {
      let days = 1;
      if (t.repeat === 'daily') days = 1;
      else if (t.repeat === '2days') days = 2;
      else if (t.repeat === 'weekly') days = 7;
      else if (t.repeat.startsWith('custom:')) days = parseInt(t.repeat.split(':')[1]) || 1;
      const nextDate = addDays(t.date, days);
      if (!DB.todos.some(x => x.text===t.text && x.date===nextDate)) {
        DB.todos.push({ id:Date.now()+1, text:t.text, priority:t.priority, repeat:t.repeat, done:false, undone:false, date:nextDate });
      }
    }
    // 习惯联动：完成 / 取消完成 → 自动点亮 / 熄灭对应日期
    if (t.habitRef) syncHabitLog(t.habitRef, t.date);
    saveDB();
    renderPage('todo','');

   学习目标管理台
======================================================== */
let goalTab = 'today';

const GOAL_COLORS = ['#9fbfb2','#e07a5f','#f2cc8f','#81b29a','#7ba89a','#b0a3c9'];
const GOAL_UNITS = ['个','页','篇','节','次','分钟'];

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function seedGoalDemo() {
  const goals = [
    { title:'背英语单词', unit:'个', target:2500, dailyTarget:20, color:GOAL_COLORS[0], plan:'如果今天状态差，一个都不想背，我就先只背10个，打开就算赢。' },
    { title:'读完《人类简史》', unit:'页', target:440, dailyTarget:4, color:GOAL_COLORS[1], plan:'如果睡前一躺下就想刷手机，我就把书放在枕头上，先读2页再看手机。' },
    { title:'Python入门课', unit:'节', target:40, dailyTarget:1, color:GOAL_COLORS[2], plan:'如果卡在一个知识点就想放弃，我就先跳过学后面的，周末回头补。' },
    { title:'读完《置身事内》', unit:'章', target:11, dailyTarget:1, color:GOAL_COLORS[3], plan:'如果晚上到家很累，我就只读1章，哪怕只看摘要也算数。' }
  ];
  const gids = [];
  goals.forEach((tg, i) => {
    const g = {
      id: uid('goal'), title: tg.title, unit: tg.unit, target: tg.target, startDate: addDays(today(), -45),
      dueDate: addDays(today(), 50 + i*10), color: tg.color, dailyTarget: tg.dailyTarget, plan: tg.plan,
      archived: false, demo: true, createdAt: Date.now()
    };
    DB.goalData.goals.push(g);
    gids.push(g.id);
  });
  const rng = mulberry32(20240813);
  const targets = [1523, 194, 18, 5];
  const activeDaysEst = 38;
  for (let dayOff = -45; dayOff <= 0; dayOff++) {
    const d = addDays(today(), dayOff);
    const dow = new Date(d+'T00:00:00').getDay();
    goals.forEach((tg, gi) => {
      const desiredAvg = targets[gi] / activeDaysEst;
      let p = desiredAvg / tg.dailyTarget;
      if (p > 0.95) p = 0.95;
      // ensure first goal logs every day for last 26 days
      if (gi === 0 && dayOff > -26) p = 1;
      if (dow === 0 && gi !== 0 && rng() < 0.6) return; // Sunday rest for others
      if (rng() > p) return;
      const amt = Math.max(1, Math.round(tg.dailyTarget * (0.7 + rng()*0.8)));
      const min = Math.max(5, Math.round(20 + rng()*25));
      DB.goalData.logs.push({ id: uid('gl'), goalId: gids[gi], date: d, amount: amt, minutes: min, note:'', demo: true, time: Date.now() + dayOff*86400000 });
    });
  }
  // small adjustment to hit approximate reference totals (distribute to past 7 days, not today)
  gids.forEach((gid, gi) => {
    const g = goalById(gid);
    const done = goalDone(g);
    let need = targets[gi] - done;
    let dayIdx = -1;
    while (need > 0 && dayIdx >= -7) {
      const amt = Math.min(need, g.dailyTarget || 1);
      DB.goalData.logs.push({ id: uid('gl'), goalId: gid, date: addDays(today(), dayIdx), amount: amt, minutes: 15, note:'', demo: true, time: Date.now() + dayIdx*86400000 });
      need -= amt;
      dayIdx--;
    }
  });
  DB.goalData.settings.seeded = true;
}

function clearGoalDemo() {
  DB.goalData.goals = DB.goalData.goals.filter(g => !g.demo);
  DB.goalData.logs = DB.goalData.logs.filter(l => !l.demo);

  saveDB(); renderPage('goal',''); showToast('示例数据已清空');
}

function goalById(id) { return DB.goalData.goals.find(g => g.id === id); }
function activeGoals() { return DB.goalData.goals.filter(g => !g.archived); }
function goalLogs(id) { return DB.goalData.logs.filter(l => l.goalId === id).sort((a,b) => b.time - a.time); }
function goalDone(g) { return DB.goalData.logs.filter(l => l.goalId === g.id).reduce((s,l) => s + (l.amount||0), 0); }
function goalPercent(g) { return g.target > 0 ? Math.min(100, Math.round(goalDone(g)/g.target*100)) : 0; }
function goalDayAgg(date) {
  const logs = DB.goalData.logs.filter(l => l.date === date);
  const byGoal = {};
  let minutes = 0, amount = 0;
  const seen = new Set();
  logs.forEach(l => {
    minutes += l.minutes || 0;
    amount += l.amount || 0;
    byGoal[l.goalId] = (byGoal[l.goalId]||0) + (l.minutes||0);
    seen.add(l.goalId);
  });
  return { minutes, amount, byGoal, goalCount: seen.size };
}
function goalTodayChecked() { return activeGoals().filter(g => DB.goalData.logs.some(l => l.goalId === g.id && l.date === today())).length; }
function calcGoalStreak(goalId) {
  let d = today();
  if (!DB.goalData.logs.some(l => l.goalId === goalId && l.date === d)) d = addDays(d, -1);
  let streak = 0;
  while (DB.goalData.logs.some(l => l.goalId === goalId && l.date === d)) {
    streak++;
    d = addDays(d, -1);
  }
  return streak;
}
function goalMaxStreak() { return Math.max(0, ...activeGoals().map(g => calcGoalStreak(g.id))); }
function goalEta(g) {
  const done = goalDone(g);
  if (done >= g.target || !g.target) return null;
  const recent = [];
  for (let i = 0; i < 14; i++) {
    const d = addDays(today(), -i);
    recent.push(...DB.goalData.logs.filter(l => l.goalId === g.id && l.date === d).map(l => l.amount||0));
  }
  const rate = recent.length ? recent.reduce((s,a)=>s+a,0)/14 : 0;
  if (rate <= 0) return null;
  const remain = g.target - done;
  const days = Math.ceil(remain / rate);
  const eta = addDays(today(), days);
  const diff = daysBetween(g.dueDate, eta);
  return { eta, diff };
}
function fmtGoalMD(ds) { return parseInt(ds.slice(5,7)) + '/' + parseInt(ds.slice(8)); }
function goalWeekMinutes(monday) {
  let sum = 0;
  for (let i = 0; i < 7; i++) sum += goalDayAgg(addDays(monday, i)).minutes;
  return sum;
}
function weekGoalAmount(goalId, monday) {
  let sum = 0;
  for (let i = 0; i < 7; i++) sum += DB.goalData.logs.filter(l => l.goalId === goalId && l.date === addDays(monday, i)).reduce((s,l)=>s+(l.amount||0),0);
  return sum;
}
function weekGoalMinutes(goalId, monday) {
  let sum = 0;
  for (let i = 0; i < 7; i++) sum += DB.goalData.logs.filter(l => l.goalId === goalId && l.date === addDays(monday, i)).reduce((s,l)=>s+(l.minutes||0),0);
  return sum;
}
function weekGoalDays(goalId, monday) {
  let days = 0;
  for (let i = 0; i < 7; i++) if (DB.goalData.logs.some(l => l.goalId === goalId && l.date === addDays(monday, i))) days++;
  return days;
}
function goalWeekTotal(monday) {
  let sum = 0;
  for (let i = 0; i < 7; i++) sum += goalDayAgg(addDays(monday, i)).minutes;
  return sum;
}
function switchGoalTab(key) { goalTab = key; renderPage('goal',''); }
function changeGoalWeek(delta) { goalWeekStart = addDays(goalWeekStart, delta*7); renderPage('goal',''); }

function renderGoalCard(g) {
  const done = goalDone(g);
  const pct = goalPercent(g);
  const streak = calcGoalStreak(g.id);
  const eta = goalEta(g);
  const logs = goalLogs(g.id);
  const todayAgg = goalDayAgg(today());
  const todayMin = todayAgg.byGoal[g.id] || 0;
  let dateOpts = '';
  for (let i = 0; i >= -6; i--) {
    const d = addDays(today(), i);
    const wd = ['日','一','二','三','四','五','六'][new Date(d+'T00:00:00').getDay()];
    dateOpts += `<option value="${d}" ${i===0?'selected':''}>${fmtGoalMD(d)} 周${wd}${i===0?' · 今天':''}</option>`;
  }
  let etaHtml = '';
  if (eta) {
    const cls = eta.diff > 0 ? 'ahead' : (eta.diff < 0 ? 'behind' : '');
    const txt = eta.diff > 0 ? `提前 ${eta.diff} 天` : (eta.diff < 0 ? `拖后 ${Math.abs(eta.diff)} 天` : '按期');
    etaHtml = `<span class="${cls}">预计 ${fmtGoalMD(eta.eta)} · ${txt}</span>`;
  } else if (pct >= 100) {
    etaHtml = `<span class="ahead">已达成</span>`;
  } else {
    etaHtml = `<span>预计 --</span>`;
  }
  const suggestion = g.dailyTarget > 0 && pct < 100 ? `今日建议 +${Math.max(1, Math.round(g.dailyTarget * (1 - pct/100)))}${g.unit}` : '';
  return `
  <div class="goal-card" style="--c:${g.color}">
    <div class="goal-ring">${renderGoalRing(pct, g.color)}</div>
    <div class="goal-card-body">
      <div class="goal-title"><span class="goal-dot"></span>${escapeHTML(g.title)}</div>
      <div class="goal-num"><b>${done}</b> / ${g.target} ${g.unit}${suggestion?` · <span class="text-sm text-gray">${suggestion}</span>`:''}</div>
      <div class="goal-meta-row">
        <span class="streak">🔥 连续 ${streak} 天</span>
        <span>📅 ${etaHtml}</span>
      </div>
      ${g.plan ? `<div class="goal-plan"><b>预案</b> ${escapeHTML(g.plan)}</div>` : ''}
      <div class="goal-records" onclick="openGoalLogs('${g.id}')">查看 ${logs.length} 条记录</div>
      <div class="goal-ci">
        <span class="ci-label">本次完成(${g.unit})</span>
        <input type="number" class="goal-ci-amt" data-gid="${g.id}" placeholder="0">
        <span class="ci-label">用时(分)</span>
        <input type="number" class="goal-ci-min" data-gid="${g.id}" placeholder="0">
        <select class="goal-ci-date" data-gid="${g.id}">${dateOpts}</select>
        <button class="btn btn-primary btn-sm" onclick="checkInGoal('${g.id}')">打卡</button>
      </div>
      ${todayMin?`<div class="text-sm text-gray mt-8">今日已投入 ${todayMin} 分钟</div>`:''}
    </div>
    <div class="goal-actions">
      <button class="btn btn-outline btn-sm" onclick="editGoal('${g.id}')">✏️</button>
      <button class="btn btn-outline btn-sm" onclick="deleteGoal('${g.id}')">🗑</button>
    </div>
  </div>`;
}

function renderGoalRing(pct, color, size=64) {
  const r = size/2 - 5;
  const c = 2 * Math.PI * r;
  const p = Math.min(100, Math.max(0, pct));
  const off = c * (1 - p/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;color:var(--text-black)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--green-light)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+5}" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${pct}%</text>
  </svg>`;
}

  if (!goals.length) {
    html += '<div class="empty-state"><span class="emoji">🎯</span>还没有进行中的目标</div>';
  } else {
    goals.forEach(g => {
      const pct = goalPercent(g);

        <span class="pct">${pct}%</span>
      </div>`;
    });
  }
  html += '</div></div>';
  html += '<div class="card mb-16"><div class="section-header"><h3>📈 近 14 天投入时长</h3></div>' + renderGoalStackedBar() + '</div>';
  html += '<div class="card mb-16"><div class="section-header"><h3>🔥 近 35 天打卡热力</h3></div>' + renderGoalHeatmap() + '</div>';
  html += renderGoalRecentActivity();
  return html;
}

function goalRecentLabel(ds) {
  const t0 = today();
  if (ds === t0) return '今天';
  if (ds === addDays(t0, -1)) return '昨天';
  if (ds === addDays(t0, -2)) return '前天';
  return fmtGoalMD(ds);
}

function renderGoalRecentActivity() {
  const logs = DB.goalData.logs.slice().sort((a,b) => b.time - a.time).slice(0, 10);
  let html = '<div class="card mb-16"><div class="section-header"><h3>🕓 最近动态</h3></div>';
  if (!logs.length) {
    html += '<div class="empty-state"><span class="emoji">📝</span>暂无记录</div>';
  } else {
    html += '<div class="goal-activity-list">';
    logs.forEach(l => {
      const g = goalById(l.goalId);
      if (!g) return;
      html += `<div class="goal-activity-item">
        <div class="goal-activity-main">
          <span class="goal-dot" style="--c:${g.color}"></span>
          <span class="goal-activity-title">${escapeHTML(g.title)}</span>
          <span class="goal-activity-amount">+${l.amount} ${g.unit} · ${l.minutes} 分钟</span>
        </div>
        <span class="goal-activity-date">${goalRecentLabel(l.date)}</span>
      </div>`;

function renderGoalStackedBar() {
  const goals = activeGoals();
  if (!goals.length || !DB.goalData.logs.length) {
    return '<div class="empty-state"><span class="emoji">📊</span>还没有投入记录</div>';
  }
  const days = [];
  for (let i = -13; i <= 0; i++) days.push(addDays(today(), i));
  const data = days.map(d => {
    const agg = goalDayAgg(d);
    return { date: d, total: agg.minutes, byGoal: agg.byGoal };
  });
  const maxTotal = Math.max(...data.map(d => d.total), 1);
  const svgW = 400, svgH = 190, baseY = 150, chartH = 120;
  const scale = chartH / maxTotal;
  const barW = 18, startX = 34;
  const gap = (352 - 14*barW)/13;
  let rects = '';
  data.forEach((d, i) => {
    const x = startX + i*(barW+gap);
    let y = baseY;
    goals.forEach(g => {
      const min = d.byGoal[g.id] || 0;
      if (min > 0) {
        const h = Math.max(1, min * scale);
        rects += `<rect x="${x}" y="${y-h}" width="${barW}" height="${h}" fill="${g.color}" rx="2"><title>${escapeHTML(g.title)} · ${min}分钟</title></rect>`;
        y -= h;
      }
    });
  });
  const grid = [0, maxTotal/2, maxTotal];
  let gridLines = '';
  grid.forEach(v => {
    const y = baseY - (v * scale);
    gridLines += `<line x1="28" y1="${y}" x2="380" y2="${y}" stroke="#d4e0cc" stroke-dasharray="2 3"/>`;
    gridLines += `<text x="26" y="${y+3}" text-anchor="end" font-size="8" fill="#888">${Math.round(v)}分</text>`;
  });
  let xlabels = '';
  data.forEach((d, i) => { if (i%2===0 || i===13) xlabels += `<text x="${startX + i*(barW+gap) + barW/2}" y="165" text-anchor="middle" font-size="8" fill="#888">${fmtGoalMD(d.date)}</text>`; });
  let legend = '<div class="study-legend" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">';
  goals.forEach(g => { legend += `<div class="study-legend-item"><span class="study-legend-dot" style="background:${g.color}"></span>${escapeHTML(g.title)}</div>`; });
  legend += '</div>';
  return `<svg width="100%" viewBox="0 0 ${svgW} ${svgH}" preserveAspectRatio="xMidYMid meet" style="display:block">
    ${gridLines}${rects}${xlabels}
  </svg>${legend}`;
}

function renderGoalHeatmap() {
  const end = weekRange(today()).sunday;
  const start = addDays(end, -34);
  const days = [];
  for (let i = 0; i < 35; i++) days.push(addDays(start, i));
  const levels = [
    { max: 0, fill: '#eef2ec', stroke: '#d4e0cc' },
    { max: 15, fill: '#dcebd6' },
    { max: 30, fill: '#c8d8be' },
    { max: 60, fill: '#9fbfb2' },
    { max: 9999, fill: '#7ba89a' }
  ];
  const cell = 34, gap = 6;
  const svgW = 7*cell + 6*gap + 20;
  const svgH = 5*cell + 4*gap + 24;
  let rects = '';
  const wdNames = ['一','二','三','四','五','六','日'];
  let headers = '';
  wdNames.forEach((w, i) => { headers += `<text x="${10 + i*(cell+gap) + cell/2}" y="16" text-anchor="middle" font-size="10" fill="#888">${w}</text>`; });
  days.forEach((d, i) => {
    const col = i % 7;
    const row = Math.floor(i / 7);
    const x = 10 + col*(cell+gap);
    const y = 24 + row*(cell+gap);
    const agg = goalDayAgg(d);
    const lvl = levels.find(l => agg.minutes <= l.max) || levels[levels.length-1];
    const isFuture = d > today();
    const isToday = d === today();
    rects += `<g opacity="${isFuture?0.25:1}">
      <rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="4" fill="${lvl.fill}" stroke="${isToday?'#7ba89a':(lvl.stroke||lvl.fill)}" stroke-width="${isToday?2:1}"/>
      <text x="${x+cell/2}" y="${y+cell/2+4}" text-anchor="middle" font-size="10" fill="${agg.minutes>30?'#1a1a1a':'#555'}">${parseInt(d.slice(8))}</text>
      <title>${d} · ${agg.minutes}分钟 · ${agg.goalCount}个目标</title>
    </g>`;
  });
  const legend = `<div class="goal-hm-legend">少 ${levels.map(l=>`<span style="background:${l.fill};border:1px solid ${l.stroke||l.fill}"></span>`).join('')} 多</div>`;
  return `<svg width="100%" viewBox="0 0 ${svgW} ${svgH}" preserveAspectRatio="xMidYMid meet" style="display:block">${headers}${rects}</svg>${legend}`;
}

    let totalCur = 0, totalPrev = 0;
    goals.forEach(g => {
      const curAmt = weekGoalAmount(g.id, monday);
      const curMin = weekGoalMinutes(g.id, monday);
      const curDays = weekGoalDays(g.id, monday);
      const prevAmt = weekGoalAmount(g.id, prevMonday);

      const prevDays = weekGoalDays(g.id, prevMonday);
      totalCur += curMin; totalPrev += prevMin;
      html += `<div class="goal-week-row">
        <div class="goal-week-title"><span class="goal-dot" style="--c:${g.color}"></span>${escapeHTML(g.title)}</div>
        <div class="goal-week-cur">+${curAmt} ${g.unit} · 打卡 ${curDays} 天 · ${curMin} 分钟</div>
        <div class="goal-week-prev">上周 +${prevAmt} ${g.unit} · 打卡 ${prevDays} 天 · ${prevMin} 分钟</div>
      </div>`;
    });
    const diff = totalCur - totalPrev;
    const diffTxt = diff > 0 ? `+${diff}` : `${diff}`;
    html += `<div class="goal-week-total">
      <span>合计投入</span>
      <span><b>${totalCur}</b> 分钟 <span class="text-sm text-gray">（上周 ${totalPrev} 分钟 · 较上周 ${diffTxt}）</span></span>
    </div>`;
  }
  html += '</div>';
  const review = DB.goalData.settings.reviews[monday] || {};
  const keepText = review.keep || review.win || '';
  const problemText = review.problem || review.block || '';
  const tryText = review.try || review.next || '';
  const planText = review.plan || '';
  html += `<div class="card mb-16">
    <div class="section-header"><h3>📝 本周复盘</h3></div>
    <div class="goal-review-q"><label>保持 Keep · 做得好的，下周继续</label><textarea class="goal-r-keep" placeholder="例：单词连续 6 天没断">${escapeHTML(keepText)}</textarea></div>
    <div class="goal-review-q"><label>问题 Problem · 卡在哪了</label><textarea class="goal-r-problem" placeholder="例：阅读总拖到睡前，一躺下就刷手机">${escapeHTML(problemText)}</textarea></div>
    <div class="goal-review-q"><label>尝试 Try · 下周试试这样改</label><textarea class="goal-r-try" placeholder="例：阅读改到午饭后 20 分钟">${escapeHTML(tryText)}</textarea></div>
    <div class="goal-review-q"><label>下周预案 · 如果…我就…</label><textarea class="goal-r-plan" placeholder="例：如果睡前想刷手机，我就先把书读 2 页">${escapeHTML(planText)}</textarea></div>

    <div class="flex-row gap-sm mt-12">
      <button class="btn btn-outline" style="flex:1" onclick="saveGoalReview()">保存复盘</button>
      <button class="btn btn-primary" style="flex:1" onclick="generateGoalReviewText()">生成周报文本</button>
    </div>
  </div>`;
  const reviewKeys = Object.keys(DB.goalData.settings.reviews).sort().reverse();
  const hist = reviewKeys.filter(k => {
    const r = DB.goalData.settings.reviews[k];
    return r.keep || r.problem || r.try || r.plan || r.win || r.block || r.next;
  });
  if (hist.length) {
    html += '<div class="card mb-16"><div class="section-header"><h3>📚 历史周报</h3></div>';
    hist.forEach(k => {
      const r = DB.goalData.settings.reviews[k];
      html += `<div class="goal-review-card">
        <div class="week">${k} 周</div>
        ${r.keep||r.win?`<div class="line"><b>保持</b> ${escapeHTML(r.keep||r.win)}</div>`:''}
        ${r.problem||r.block?`<div class="line"><b>问题</b> ${escapeHTML(r.problem||r.block)}</div>`:''}
        ${r.try||r.next?`<div class="line"><b>尝试</b> ${escapeHTML(r.try||r.next)}</div>`:''}
        ${r.plan?`<div class="line"><b>预案</b> ${escapeHTML(r.plan)}</div>`:''}
      </div>`;
    });
    html += '</div>';
  }
  return html;
}

function renderGoalWeekPulse(monday) {
  let html = '<div class="goal-pulse-row">';
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const wd = ['一','二','三','四','五','六','日'][i];
    const agg = goalDayAgg(d);
    const isFuture = d > today();
    const cls = agg.minutes > 0 ? 'on' : '';
    html += `<div class="goal-pulse-cell ${cls}" style="${isFuture?'opacity:.35':''}">
      <div class="wd">${wd}</div>
      <div class="md">${fmtGoalMD(d)}</div>
      <div class="check">${agg.minutes > 0 ? '✓' : '·'}</div>
      <div class="min">${agg.minutes}分</div>
    </div>`;
  }
  html += '</div>';
  return html;
}

function saveGoal(id) {
  const title = (document.querySelector('#modalOverlay .goal-f-title')?.value || '').trim();
  const target = parseInt(document.querySelector('#modalOverlay .goal-f-target')?.value) || 0;
  const unit = document.querySelector('#modalOverlay .goal-f-unit')?.value || '个';
  const dailyTarget = parseInt(document.querySelector('#modalOverlay .goal-f-daily')?.value) || 0;
  const dueDate = document.querySelector('#modalOverlay .goal-f-due')?.value || addDays(today(), 30);
  const plan = (document.querySelector('#modalOverlay .goal-f-plan')?.value || '').trim();
  const color = document.querySelector('#modalOverlay .goal-f-color')?.value || GOAL_COLORS[0];
  if (!title) { showToast('请输入目标名称'); return; }
  if (target <= 0) { showToast('总量目标需大于0'); return; }
  if (id) {
    const g = goalById(id);
    g.title = title; g.target = target; g.unit = unit; g.dailyTarget = dailyTarget;
    g.dueDate = dueDate; g.plan = plan; g.color = color;
  } else {
    DB.goalData.goals.push({
      id: uid('goal'), title, unit, target, startDate: today(), dueDate,
      color, dailyTarget, plan, archived: false, demo: false, createdAt: Date.now()
    });
  }
  saveDB(); closeModal(); renderPage('goal',''); showToast('目标已保存');
}

function deleteGoal(id) {
  confirmAction('确定删除该目标及其全部打卡记录吗？', () => {
    DB.goalData.goals = DB.goalData.goals.filter(g => g.id !== id);
    DB.goalData.logs = DB.goalData.logs.filter(l => l.goalId !== id);
    saveDB(); renderPage('goal',''); showToast('目标已删除');
  });
}

function generateGoalReviewText() {
  const { monday } = weekRange(goalWeekStart);
  const goals = activeGoals();
  const keep = (document.querySelector('.goal-r-keep')?.value || '').trim();
  const problem = (document.querySelector('.goal-r-problem')?.value || '').trim();
  const trys = (document.querySelector('.goal-r-try')?.value || '').trim();
  const plan = (document.querySelector('.goal-r-plan')?.value || '').trim();
  const range = monday.slice(5) + ' ~ ' + addDays(monday, 6).slice(5);
  let totalCur = 0, totalPrev = 0, totalDays = 0;
  const goalLines = [];
  goals.forEach(g => {
    const curAmt = weekGoalAmount(g.id, monday);
    const curMin = weekGoalMinutes(g.id, monday);
    const curDays = weekGoalDays(g.id, monday);
    const prevMin = weekGoalMinutes(g.id, addDays(monday, -7));
    totalCur += curMin; totalPrev += prevMin; totalDays += curDays;
    goalLines.push(`${g.title}：+${curAmt}${g.unit}，打卡${curDays}天，投入${curMin}分钟（上周${prevMin}分钟）`);
  });
  const diff = totalCur - totalPrev;
  const diffTxt = diff > 0 ? `+${diff}` : `${diff}`;
  let text = `📝 学习目标周报（${range}）\n\n`;
  text += `本周共投入 ${totalCur} 分钟，打卡 ${totalDays} 天；较上周 ${diffTxt} 分钟。\n`;
  if (goalLines.length) text += '\n' + goalLines.join('\n') + '\n';
  if (keep) text += `\n✅ 保持：${keep}`;
  if (problem) text += `\n❓ 问题：${problem}`;
  if (trys) text += `\n💡 尝试：${trys}`;
  if (plan) text += `\n🎯 预案：${plan}`;
  const out = document.querySelector('.goal-review-output');
  if (out) out.value = text.trim();
}

  CET4_WORDS.forEach(w => { dict[w.word.toLowerCase()] = w; });
  CET6_WORDS.forEach(w => { dict[w.word.toLowerCase()] = w; });

})();

// 获取当前活跃词库
function getActiveWordBank() {
  const bank = wordPageState.wordBank || 'bec-mixed';
  if (bank === 'bec-junior') return BEC_WORDS.filter(w => w.level === '初级');
  if (bank === 'bec-senior') return BEC_WORDS.filter(w => w.level === '中级');
  if (bank === 'bec-mixed') return BEC_WORDS;
  if (bank === 'cet4') return CET4_WORDS;
  if (bank === 'cet6') return CET6_WORDS;
  return BEC_WORDS;
}

/* 高频词权重选题：高频词出现概率×3，去重后不足minCount则重置 */
function getWeightedPool(pool, completedList, minCount) {
  // 去重
  let available = pool.filter(w => !completedList.includes(w.word));
  if (available.length < minCount) {
    // 不足最低数量，重置去重记录
    completedList.length = 0;
    available = pool;
  }
  // 高频权重：高频词重复3份
  const weighted = [];
  available.forEach(w => {
    const weight = w.frequency === 'high' ? 3 : 1;
    for (let i = 0; i < weight; i++) weighted.push(w);
  });
  return weighted;
}

/* 获取去重后的题库（非单词类：听力/阅读） */
function getFilteredPool(pool, completedList, minCount, keyFn) {
  let available = pool.filter(item => !completedList.includes(keyFn(item)));
  if (available.length < minCount) {
    completedList.length = 0;
    available = pool;
  }
  return available;
}

  const lower = wordText.toLowerCase().trim();

}

function getCompatBanner(sp) {
  const ttsOk = 'speechSynthesis' in window;
  const ttsVoiceOk = ttsOk && (() => {
    try { const voices = window.speechSynthesis.getVoices(); return voices.some(v => v.lang.startsWith('en')); }
    catch(e) { return false; }
  })();
  const mediaDevicesOk = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const mediaRecorderOk = 'MediaRecorder' in window;
  const googleTtsOk = true; // Google TTS API 作为后备始终可用（需网络）

  // 单词页主要看 TTS，听力页也看 TTS，口语页看录音
  const items = [];
  if (sp === 'english-words' || sp === 'english-listening') {
    items.push({ label: 'TTS 朗读（浏览器内置）', ok: ttsOk });
    items.push({ label: 'TTS 朗读（在线后备）', ok: googleTtsOk });
    if (!ttsOk) items.push({ label: '建议使用 Chrome/Edge 浏览器获得最佳体验', ok: false, tip: true });
  }
  if (sp === 'english-speaking') {
    items.push({ label: '麦克风权限', ok: mediaDevicesOk });
    items.push({ label: '录音 API（MediaRecorder）', ok: mediaRecorderOk });
    items.push({ label: 'TTS 示范发音', ok: ttsOk || googleTtsOk });
    if (!mediaDevicesOk || !mediaRecorderOk) items.push({ label: 'Android 设备请使用 Chrome 浏览器并允许麦克风权限', ok: false, tip: true });
  }

  const allOk = items.filter(it => !it.tip).every(it => it.ok);
  const anyFail = items.some(it => !it.ok && !it.tip);

  let html = `<div class="compat-banner${allOk ? ' success' : ''}" id="compatBanner">
    <span class="compat-icon">${allOk ? '✅' : '⚠️'}</span>
    <div style="flex:1">
      <strong>${allOk ? '环境检测通过' : '兼容性提醒'}</strong>`;
  items.forEach(it => {
    html += `<div class="compat-item">${it.ok ? '<span class="compat-ok">✓</span>' : (it.tip ? '💡' : '<span class="compat-fail">✗</span>')} ${it.label}</div>`;
  });
  html += `</div><button class="compat-close" onclick="document.getElementById('compatBanner').style.display='none'" title="关闭" aria-label="关闭">✕</button></div>`;
  return html;
}

async function startShadowRecording(sentence) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast('❌ 浏览器不支持录音');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    let mimeType = '';
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', ''];
    for (const t of types) {
      if (t === '' || MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
    }
    shadowMediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    shadowAudioChunks = [];

    shadowMediaRecorder.ondataavailable = e => { if (e.data.size > 0) shadowAudioChunks.push(e.data); };
    shadowMediaRecorder.onstop = () => {
      const blobType = mimeType || 'audio/webm';
      const blob = new Blob(shadowAudioChunks, { type: blobType });
      const url = URL.createObjectURL(blob);
      const player = document.getElementById('shadowAudioPlayer');
      if (player) { player.src = url; player.style.display = 'inline-block'; }

      // AI 纠音
      setTimeout(() => {
        showShadowCorrection(sentence);
      }, 500);

      stream.getTracks().forEach(t => t.stop());
    };

    shadowMediaRecorder.start();
    // 自动停止
    setTimeout(() => {
      if (shadowMediaRecorder && shadowMediaRecorder.state === 'recording') {
        shadowMediaRecorder.stop();
      }
    }, 8000);
  } catch(e) {
    showToast('❌ 无法访问麦克风');
    stopShadowTraining();
  }
}

function calcStreak() {
  let streak = 0;
  let checkDate = today();
  while (isDayChecked(checkDate)) { streak++; checkDate = addDays(checkDate, -1); }
  return streak;
}

function renderCalendar(month) {
  const [y,m] = month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDay = new Date(y, m-1, 1).getDay(); // 0=周日
  const td = today();
  const weekdays = ['日','一','二','三','四','五','六'];
  let html = '<div class="cal-grid">';
  weekdays.forEach(w => html += `<div class="cal-weekday">${w}</div>`);
  for (let i=0; i<firstDay; i++) html += '<div></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const checked = isDayChecked(dateStr);
    const isToday = dateStr === td;
    html += `<div class="cal-day ${checked?'checked':''} ${isToday?'today':''}">${d}</div>`;
  }
  html += '</div>';
  return html;
}

function renderBarChart(data, label, key) {
  const maxVal = Math.max(...data.map(d=>d[key]), 1);
  let svg = '<svg width="100%" height="160" viewBox="0 0 400 160">';
  svg += '<line x1="30" y1="130" x2="380" y2="130" stroke="#d4e0cc" stroke-width="1"/>';
  const barW = 36, totalW = 350, gap = (totalW - barW*7)/6;
  data.forEach((d, i) => {
    const x = 35 + i*(barW+gap);
    const h = (d[key]/maxVal)*110;
    const y = 130 - h;
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="#9fbfb2"/>`;
    svg += `<text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="#555">${d[key]}</text>`;
    svg += `<text x="${x+barW/2}" y="142" text-anchor="middle" font-size="8" fill="#888">${d.date}</text>`;
  });
  svg += '</svg>';
  return svg;
}

const STUDY_MODULES = [
  { key:'word',      name:'单词', emoji:'📝', color:'#9fbfb2', perMin:1 },
  { key:'listening', name:'听力', emoji:'🎧', color:'#7c9eb2', perMin:2 },
  { key:'speaking',  name:'口语', emoji:'🗣',  color:'#c2a36b', perMin:2 },
  { key:'reading',   name:'阅读', emoji:'📖', color:'#b27c9e', perMin:2 },
  { key:'writing',   name:'写作', emoji:'✍️', color:'#b27c7c', perMin:8 },
];

function getDayStudy(date) {
  const s = DB.englishData.studyLogs[date];
  if (!s) return { word:0, listening:0, speaking:0, reading:0, writing:0, total:0 };
  if (typeof s === 'number') return { word:0, listening:0, speaking:0, reading:0, writing:0, total:s };
  const total = (s.word||0)+(s.listening||0)+(s.speaking||0)+(s.reading||0)+(s.writing||0);
  return { word:s.word||0, listening:s.listening||0, speaking:s.speaking||0, reading:s.reading||0, writing:s.writing||0, total };
}

function addEnglishStudy(module, minutes) {
  if (!minutes || minutes <= 0) return;
  const t = today();
  let s = DB.englishData.studyLogs[t];
  if (!s || typeof s === 'number') s = { word:0, listening:0, speaking:0, reading:0, writing:0 };
  s[module] = (s[module]||0) + minutes;
  DB.englishData.studyLogs[t] = s;
  saveDB();
}

function isDayChecked(date) {
  // 打卡日历点亮规则：当日待办任务全部完成才点亮（无任务则不点亮）
  const dayTodos = (DB.todos || []).filter(t => t.date === date);
  return dayTodos.length > 0 && dayTodos.every(t => t.done);
}

function studyMinOf(module) {
  const m = STUDY_MODULES.find(x => x.key === module);
  return m ? m.perMin : 1;
}

/* 近7天学习时长趋势：分模块堆叠（风格参考财务收支趋势图） */
function renderStudyTrendChart() {
  const days = [];
  for (let i=6; i>=0; i--) {
    const d = addDays(today(), -i);
    const s = getDayStudy(d);
    days.push({ date: d.slice(5), word:s.word, listening:s.listening, speaking:s.speaking, reading:s.reading, writing:s.writing, total:s.total });
  }
  const maxTotal = Math.max(...days.map(d => d.total), 1);

  const barW = 30, totalW = 350, gap = (totalW - barW*7)/6;
  let svg = '<svg width="100%" height="180" viewBox="0 0 400 180">';
  svg += '<line x1="30" y1="150" x2="385" y2="150" stroke="#d4e0cc" stroke-width="1"/>';
  days.forEach((d, i) => {
    const x = 35 + i*(barW+gap);
    let yCursor = 150;
    STUDY_MODULES.forEach(m => {
      const h = (d[m.key]/maxTotal)*120;
      if (h > 0) {
        svg += `<rect x="${x}" y="${yCursor-h}" width="${barW}" height="${h}" rx="2" fill="${m.color}"><title>${d.date} · ${m.name} ${d[m.key]}分钟</title></rect>`;
        yCursor -= h;
      }
    });
    // 顶部合计
    svg += `<text x="${x+barW/2}" y="${yCursor-5}" text-anchor="middle" font-size="9" fill="#444" font-weight="600">${d.total||''}</text>`;
    svg += `<text x="${x+barW/2}" y="165" text-anchor="middle" font-size="8" fill="#888">${d.date}</text>`;
  });
  svg += '</svg>';

  // 图上标注：单行紧凑配色图例（去图标，仅保留色点+板块名）
  let legend = '<div class="flex-row mt-8" style="flex-wrap:nowrap;gap:12px;white-space:nowrap;overflow-x:auto">';
  STUDY_MODULES.forEach(m => {
    legend += `<span class="study-legend-item" style="font-weight:400"><span class="study-legend-dot" style="background:${m.color}"></span>${m.name}</span>`;
  });
  legend += '</div>';

  return svg + legend;
}

function speakWord(text) {
  if (!text) { showToast('⚠️ 没有文本可播放'); return; }
  // 方案1: 浏览器原生 TTS
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      u.pitch = 1;

      const doSpeak = () => {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
          const enVoice = voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en')) || voices[0];
          u.voice = enVoice;
        }
        u.onerror = (e) => {
          console.log('TTS speak error, falling back to Google TTS:', e.error);
          speakWordGoogle(text);
        };
        window.speechSynthesis.speak(u);
        showToast('🔊 正在朗读...');
      };

      // Android 某些浏览器需要异步加载 voices
      if (window.speechSynthesis.getVoices().length === 0) {
        const loadHandler = () => {
          window.speechSynthesis.removeEventListener('voiceschanged', loadHandler);
          doSpeak();
        };
        window.speechSynthesis.addEventListener('voiceschanged', loadHandler);
        // 超时兜底：500ms 后不管有没有 voice 都朗读
        setTimeout(() => {
          window.speechSynthesis.removeEventListener('voiceschanged', loadHandler);
          if (window.speechSynthesis.speaking) return; // 已经开始了
          doSpeak();
        }, 600);
      } else {
        doSpeak();
      }
      return;
    } catch(e) {
      console.log('TTS error, trying fallback:', e);
    }
  }
  // 方案2: Google TTS
  speakWordGoogle(text);
}

function speakWordGoogle(text) {
  if (!text) return;
  const audio = new Audio();
  audio.crossOrigin = 'anonymous';
  // 长文本分段播放（Google TTS 有长度限制）
  const maxLen = 200;
  if (text.length > maxLen) {
    const chunks = text.match(new RegExp('.{1,' + maxLen + '}', 'g')) || [text];
    let idx = 0;
    const playNext = () => {
      if (idx >= chunks.length) return;
      const a = new Audio();
      a.crossOrigin = 'anonymous';
      a.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(chunks[idx]);
      a.onended = () => { idx++; playNext(); };
      a.onerror = () => { idx++; playNext(); };
      a.play().catch(() => { idx++; playNext(); });
    };
    playNext();
    showToast('🔊 正在朗读（在线分段）...');
  } else {

function renderWordQuiz() {
  const modes = [
    { key:'classic',   label:'📝 经典自测', desc:'英译汉/汉译英' },
    { key:'bomb',      label:'💣 词汇炸弹', desc:'选错引爆，生命有限' },
    { key:'match',     label:'🔗 释义匹配', desc:'限时连线闯关' },
    { key:'eliminate', label:'🎲 消消乐',   desc:'配对消除，限时闯关' },
    { key:'root',      label:'🌱 词根闯关', desc:'词根选衍生词' },
  ];
  let html = `<div class="game-mode-selector mb-12">
    <span class="text-sm text-gray" style="align-self:center;margin-right:4px">游戏模式：</span>`;
  modes.forEach(m => {
    html += `<button class="game-mode-btn ${wordPageState.gameMode===m.key?'active':''}" onclick="switchGameMode('${m.key}')" title="${m.desc}" aria-label="${m.desc}">${m.label}</button>`;
  });
  html += '</div>';

  if (wordPageState.gameMode === 'classic')        html += renderQuizClassic();
  else if (wordPageState.gameMode === 'bomb')      html += renderQuizBomb();
  else if (wordPageState.gameMode === 'match')     html += renderQuizMatch();
  else if (wordPageState.gameMode === 'eliminate') html += renderQuizEliminate();
  else if (wordPageState.gameMode === 'root')      html += renderQuizRoot();

  return html;
}

function switchGameMode(mode) {
  if (wordPageState.matchState.timerId) { clearInterval(wordPageState.matchState.timerId); wordPageState.matchState.timerId = null; }
  if (wordPageState.eliminateState.timerId) { clearInterval(wordPageState.eliminateState.timerId); wordPageState.eliminateState.timerId = null; }
  wordPageState.bombState = { lives:3, score:0, currentWord:null, opts:[], correctIdx:-1, answered:false };
  wordPageState.matchState = { pairs:[], rightOrder:[], leftSelected:-1, rightSelected:-1, rightOrigIdx:-1, matched:[], score:0, timeLeft:60, timerId:null };
  wordPageState.eliminateState = { cards:[], selected:[], score:0, timeLeft:60, timerId:null };
  wordPageState.rootState = { idx:0, score:0, currentRoot:null, correctWord:null, opts:[], correctIdx:-1, answered:false };
  wordPageState.gameMode = mode;
  if (mode === 'classic') {
    wordPageState.quizWords = [];
    wordPageState.quizIdx = 0;
    wordPageState.quizCorrect = 0;
    wordPageState.quizWrong = 0;
  }
  switchPage('english', 'english-words');
}

/* 经典自测 */

function answerQuizWord(choice, correct, word) {
  const opts = document.querySelectorAll('#quizOptions .quiz-opt');
  opts.forEach((el, i) => {
    if (i === correct) el.classList.add('correct');
    else if (i === choice && choice !== correct) el.classList.add('wrong');
    el.style.pointerEvents = 'none';
  });
  if (choice === correct) {
    wordPageState.quizCorrect++;
    showToast('✅ 回答正确！');
  } else {
    wordPageState.quizWrong++;
    const wordData = getActiveWordBank().find(w => w.word === word) || BIG_DICT[word.toLowerCase()];
    const exists = DB.englishData.errorBook.find(e => e.content === word && e.type === '单词');
    if (!exists) {
      DB.englishData.errorBook.push({ type:'单词', content: word, date: today(), analysis: wordData ? wordData.meaning : '' });
    }
    saveDB();
    showToast('❌ 回答错误，已加入错题本');
  }
  addEnglishStudy('word', studyMinOf('word'));
  setTimeout(() => {
    wordPageState.quizIdx++;
    switchPage('english','english-words');
  }, 1200);
}

      <button class="btn btn-outline btn-sm mt-8" onclick="DB.englishData.completedItems.wordMatch=[];saveDB();wordPageState.matchState={pairs:[],rightOrder:[],leftSelected:-1,rightSelected:-1,rightOrigIdx:-1,matched:[],score:0,timeLeft:60,timerId:null};switchPage('english','english-words')">🔄 复习旧题</button>

function clickMatchItem(side, idx) {
  const ms = wordPageState.matchState;
  if (side === 'left') {
    ms.leftSelected = idx;
  } else {
    ms.rightSelected = idx;
    const rightItem = document.querySelector('[data-side="right"][data-idx="'+idx+'"]');
    if (rightItem) ms.rightOrigIdx = parseInt(rightItem.getAttribute('data-orig'));
  }
  if (ms.leftSelected >= 0 && ms.rightSelected >= 0) {
    if (ms.leftSelected === ms.rightOrigIdx && !ms.matched.includes(ms.leftSelected)) {
      ms.matched.push(ms.leftSelected);
      ms.score++;
      showToast('✅ 匹配正确！');
    } else {
      showToast('❌ 匹配错误');
    }
    addEnglishStudy('word', studyMinOf('word'));
    ms.leftSelected = -1;
    ms.rightSelected = -1;
    ms.rightOrigIdx = -1;
  }
  switchPage('english','english-words');
}

      <button class="btn btn-outline btn-sm mt-8" onclick="DB.englishData.completedItems.wordEliminate=[];saveDB();wordPageState.eliminateState={cards:[],selected:[],score:0,timeLeft:60,timerId:null};switchPage('english','english-words')">🔄 复习旧题</button>
    </div>`;
  }
  if (es.score >= 6) {
    if (es.timerId) { clearInterval(es.timerId); es.timerId = null; }
    es.cards.forEach(c => { if (c.type==='en' && c.pairId>=0 && !ci.wordEliminate.includes(c.text)) ci.wordEliminate.push(c.text); });

    return `<div class="quiz-area text-center">
      <div style="font-size:48px">🎉</div>
      <div class="text-xl font-bold mt-12">全部消除完成！</div>
      <div class="text-lg mt-8">剩余时间 ${es.timeLeft}s</div>
      <button class="btn btn-primary mt-16" onclick="wordPageState.eliminateState={cards:[],selected:[],score:0,timeLeft:60,timerId:null};switchPage('english','english-words')">再来一局（新题）</button>
      <button class="btn btn-outline btn-sm mt-8" onclick="DB.englishData.completedItems.wordEliminate=[];saveDB();wordPageState.eliminateState={cards:[],selected:[],score:0,timeLeft:60,timerId:null};switchPage('english','english-words')">🔄 复习旧题</button>
    </div>`;

  let html = `<div class="quiz-area eliminate-area">
    <div class="flex-between mb-12">
      <span class="badge eliminate-timer">⏱️ ${es.timeLeft}s</span>
      <span class="badge">已消除 ${es.score}/6</span>
    </div>
    <div class="eliminate-grid">`;

      html += `<div class="eliminate-card eliminated"></div>`;
    } else {
      const isSelected = es.selected.includes(i);
      html += `<div class="eliminate-card ${isSelected?'selected':''}" data-cardidx="${i}">${escapeHTML(c.text)}</div>`;
    }
  });
  html += '</div></div>';
  return html;
}

function clickEliminateCard(cardIdx) {
  const es = wordPageState.eliminateState;
  const card = es.cards[cardIdx];
  if (!card || card.pairId === -1) return;
  if (es.selected.includes(cardIdx)) {
    es.selected = es.selected.filter(i => i !== cardIdx);
    switchPage('english','english-words');
    return;
  }
  if (es.selected.length >= 2) return;
  es.selected.push(cardIdx);
  if (es.selected.length === 2) {
    const [a, b] = es.selected;
    const cardA = es.cards[a];
    const cardB = es.cards[b];
    if (cardA.pairId === cardB.pairId && cardA.type !== cardB.type) {
      es.score++;
      es.cards[a].pairId = -1;
      es.cards[b].pairId = -1;
      es.selected = [];
      showToast('✅ 消除成功！');
      addEnglishStudy('word', studyMinOf('word'));
      switchPage('english','english-words');
    } else {
      showToast('❌ 不匹配');
      addEnglishStudy('word', studyMinOf('word'));
      setTimeout(() => {
        es.selected = [];
        switchPage('english','english-words');
      }, 600);
      return;
    }
  } else {
    switchPage('english','english-words');
  }
}

/* 词根词缀闯关 */
function renderQuizRoot() {
  const rs = wordPageState.rootState;
  const ci = DB.englishData.completedItems;
  if (!rs.currentRoot) {
    // 词根去重：跳过已完成的词根
    const availableRoots = WORD_ROOTS.filter(r => !ci.wordRoot.includes(r.root));
    if (availableRoots.length === 0) { ci.wordRoot.length = 0; } // 全部做完则重置
    const rootPool = availableRoots.length > 0 ? availableRoots : WORD_ROOTS;
    rs.currentRoot = rootPool[rs.idx % rootPool.length];
    const pool = getActiveWordBank();
    const correct = pool.filter(w => rs.currentRoot.derivatives.includes(w.word));
    rs.correctWord = correct.length > 0 ? correct[0] : { word: rs.currentRoot.derivatives[0], meaning: '' };
    const wrongs = pool.filter(w => !rs.currentRoot.derivatives.includes(w.word)).sort(()=>Math.random()-0.5).slice(0,3);
    while (wrongs.length < 3) {
      const otherRoot = WORD_ROOTS[(rs.idx + wrongs.length + 1) % WORD_ROOTS.length];
      const fillWord = pool.find(w => otherRoot.derivatives.includes(w.word) && !wrongs.includes(w) && w.word !== rs.correctWord.word);
      if (fillWord) wrongs.push(fillWord);
      else break;
    }
    rs.opts = [rs.correctWord, ...wrongs].sort(()=>Math.random()-0.5);
    rs.correctIdx = rs.opts.findIndex(w => w.word === rs.correctWord.word);
    rs.answered = false;
  }
  let html = `<div class="quiz-area root-area">
    <div class="flex-between mb-12">
      <span class="text-sm text-gray">第 ${rs.idx+1} 关</span>
      <span class="badge">得分 ${rs.score}</span>
    </div>
    <div class="root-display">
      <div class="root-label">🌱 商务词根</div>
      <div class="root-text">${escapeHTML(rs.currentRoot.root)}</div>
      <div class="root-meaning">${escapeHTML(rs.currentRoot.rootMeaning)}</div>
      <div class="root-hint text-sm text-gray mt-8">${escapeHTML(rs.currentRoot.hint)}</div>
    </div>
    <div class="quiz-question">选择包含该词根的衍生商务词汇：</div>
    <div class="quiz-options" id="quizOptions">`;
  rs.opts.forEach((opt, i) => {
    html += `<div class="quiz-opt" data-idx="${i}" data-correct="${rs.correctIdx}" data-game="root">${escapeHTML(opt.word)}</div>`;
  });
  html += '</div></div>';
  return html;
}

function answerRoot(choice, correct) {
  const rs = wordPageState.rootState;
  if (rs.answered) return;
  rs.answered = true;
  const opts = document.querySelectorAll('#quizOptions .quiz-opt');
  opts.forEach((el, i) => {
    if (i === correct) el.classList.add('correct');
    else if (i === choice) el.classList.add('wrong');
    el.style.pointerEvents = 'none';
  });
  if (choice === correct) {
    rs.score++;
    showToast('✅ 正确！');
  } else {
    showToast('❌ 错误');
  }
  addEnglishStudy('word', studyMinOf('word'));
  setTimeout(() => {
    // 记录已完成词根
    if (rs.currentRoot && !DB.englishData.completedItems.wordRoot.includes(rs.currentRoot.root)) {
      DB.englishData.completedItems.wordRoot.push(rs.currentRoot.root);
      saveDB();
    }
    rs.idx++;
    rs.currentRoot = null;
    rs.correctWord = null;
    rs.answered = false;
    switchPage('english','english-words');
  }, 1500);
}

/* 单词自测事件委托 + 定时器管理 */
function bindWordQuizEvents() {
  // quiz-opt 点击 (classic / bomb / root)
  document.querySelectorAll('#quizOptions .quiz-opt').forEach(el => {
    el.addEventListener('click', function() {
      const idx = parseInt(this.getAttribute('data-idx'));
      const correct = parseInt(this.getAttribute('data-correct'));
      const game = this.getAttribute('data-game');
      const word = this.getAttribute('data-word');
      if (word) {
        answerQuizWord(idx, correct, word);
      } else if (game === 'bomb') {
        answerBomb(idx, correct);
      } else if (game === 'root') {
        answerRoot(idx, correct);
      }
    });
  });
  // 释义匹配
  document.querySelectorAll('.match-item').forEach(el => {
    el.addEventListener('click', function() {
      const side = this.getAttribute('data-side');
      const idx = parseInt(this.getAttribute('data-idx'));
      if (!this.classList.contains('matched')) {
        clickMatchItem(side, idx);
      }
    });
  });
  // 消消乐
  document.querySelectorAll('.eliminate-card').forEach(el => {
    if (!el.classList.contains('eliminated')) {
      el.addEventListener('click', function() {
        const cardIdx = parseInt(this.getAttribute('data-cardidx'));
        clickEliminateCard(cardIdx);
      });
    }
  });
  // 启动 match 定时器
  if (wordPageState.gameMode === 'match' && !wordPageState.matchState.timerId && wordPageState.matchState.timeLeft > 0 && wordPageState.matchState.matched.length < wordPageState.matchState.pairs.length) {
    wordPageState.matchState.timerId = setInterval(() => {
      wordPageState.matchState.timeLeft--;
      const badge = document.querySelector('.match-timer');
      if (badge) badge.textContent = '⏱️ ' + wordPageState.matchState.timeLeft + 's';
      if (wordPageState.matchState.timeLeft <= 0) {
        clearInterval(wordPageState.matchState.timerId);
        wordPageState.matchState.timerId = null;
        switchPage('english','english-words');
      }
    }, 1000);
  }
  // 启动 eliminate 定时器
  if (wordPageState.gameMode === 'eliminate' && !wordPageState.eliminateState.timerId && wordPageState.eliminateState.timeLeft > 0 && wordPageState.eliminateState.score < 6) {
    wordPageState.eliminateState.timerId = setInterval(() => {
      wordPageState.eliminateState.timeLeft--;
      const badge = document.querySelector('.eliminate-timer');
      if (badge) badge.textContent = '⏱️ ' + wordPageState.eliminateState.timeLeft + 's';
      if (wordPageState.eliminateState.timeLeft <= 0) {
        clearInterval(wordPageState.eliminateState.timerId);
        wordPageState.eliminateState.timerId = null;
        switchPage('english','english-words');
      }
    }, 1000);
  }
}

        <button class="btn btn-outline btn-sm" onclick="DB.englishData.completedItems.listening=[];saveDB();listeningState.qIdx=0;listeningState.score=0;listeningState.task=null;switchPage('english','english-listening')">🔄 复习</button>
        ${score>=75 && listeningState.level==='初级' ? `<button class="btn btn-primary" onclick="listeningState.level='中级';listeningState.qIdx=0;listeningState.score=0;listeningState.task=null;switchPage('english','english-listening')">挑战中级</button>` : ''}

      <span class="text-sm text-gray">级别：${listeningState.level} · ${task.title}</span>
      <span class="badge">${listeningState.qIdx+1}/${task.questions.length}</span>
    </div>

      <button class="btn btn-primary btn-sm" onclick="speakListening('${listeningState.qIdx}')" style="font-size:14px">🔊 播放听力</button>
      <button class="btn btn-outline btn-sm" onclick="speakListeningSlow('${listeningState.qIdx}')" style="font-size:12px">🐢 慢速播放</button>
      <span class="text-sm text-gray" id="listeningStatus"></span>
    </div>
    <div class="quiz-question">${q.q}</div>
    <div class="quiz-options" id="quizOptions">`;
  q.opts.forEach((opt, i) => {
    html += `<div class="quiz-opt" onclick="answerListening(${i}, ${q.ans})">${opt}</div>`;
  });

function speakListening(qIdx) {
  const task = listeningState.task;
  if (!task || !task.text) { showToast('暂无听力文本'); return; }
  speakWord(task.text);
  const el = document.getElementById('listeningStatus');

function speakListeningSlow(qIdx) {
  const task = listeningState.task;
  if (!task || !task.text) { showToast('暂无听力文本'); return; }
  // 用 Google TTS 慢速：分段播放加延迟
  const sentences = task.text.match(/[^.!?]+[.!?]+/g) || [task.text];
  let delay = 0;
  sentences.forEach((s, i) => {
    setTimeout(() => {
      const audio = new Audio();
      audio.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(s.trim());
      audio.play().catch(() => {});
    }, delay);

  });

}

function answerListening(choice, correct) {
  const opts = document.querySelectorAll('#quizOptions .quiz-opt');
  opts.forEach((el, i) => {
    if (i === correct) el.classList.add('correct');
    else if (i === choice && choice !== correct) el.classList.add('wrong');

    DB.englishData.errorBook.push({ type:'听力', content: task.questions[listeningState.qIdx].q, date: today(), analysis: '正确答案：'+task.questions[listeningState.qIdx].opts[correct] });

    listeningState.qIdx++;
    switchPage('english','english-listening');

}

/* 听音听写填空 */
function renderIntensiveDictation() {
  const tasks = LISTENING_TASKS.filter(t => t.level === listeningState.level);
  const task = tasks[listeningState.dictationState.taskIdx];
  if (!task) return '<div class="card"><div class="empty-state">暂无素材</div></div>';

  if (listeningState.dictationState.blanks.length === 0) {
    const words = task.text.split(/\s+/);
    const blankRate = listeningState.dictationState.blankRate / 100;
    const candidates = words.map((w, i) => ({ word: w, idx: i }))
      .filter(c => c.word.length > 3 && /[a-zA-Z]/.test(c.word) && !/^[A-Z]:$/.test(c.word));
    const blankCount = Math.max(3, Math.floor(candidates.length * blankRate));
    const shuffled = [...candidates].sort(() => Math.random() - 0.5).slice(0, blankCount);
    const blankIdxs = new Set(shuffled.map(s => s.idx));
    listeningState.dictationState.blanks = candidates
      .filter(c => blankIdxs.has(c.idx))
      .map(c => ({
        wordIdx: c.idx,
        answer: c.word.replace(/[^a-zA-Z]/g, ''),
        hint: c.word[0] + '_'.repeat(Math.max(1, c.word.length - 2)) + c.word[c.word.length-1],
        userInput: '',
        checked: false,
        correct: false
      }));
  }

  const blanks = listeningState.dictationState.blanks;
  const words = task.text.split(/\s+/);
  const blankMap = {};
  blanks.forEach((b, bi) => { blankMap[b.wordIdx] = bi; });

  let html = `<div class="card">
    <div class="section-header">
      <h3>✍️ 听音听写</h3>
      <span class="badge">${escapeHTML(task.title)}</span>
    </div>
    <div class="flex-row gap-sm mb-12" style="flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="speakIntensiveText()">🔊 播放完整音频</button>
      <button class="btn btn-outline btn-sm" onclick="speakIntensiveTextSlow()">🐢 慢速播放</button>
      <span class="text-sm text-gray" id="intensiveStatus"></span>
    </div>
    <div class="mb-12 flex-row" style="gap:6px;flex-wrap:wrap">
      <span class="text-sm text-gray" style="align-self:center">挖空比例：</span>
      <button class="word-filter-btn ${listeningState.dictationState.blankRate===75?'active':''}" onclick="changeBlankRate(75)">75%</button>
      <button class="word-filter-btn ${listeningState.dictationState.blankRate===100?'active':''}" onclick="changeBlankRate(100)">100%</button>
      <button class="btn btn-outline btn-sm" onclick="toggleIntensiveAnswers()">${listeningState.dictationState.showAnswers?'🙈 隐藏答案':'👁 显示答案'}</button>
    </div>
    <div class="dictation-text">`;
  words.forEach((w, i) => {
    if (blankMap.hasOwnProperty(i)) {
      const bi = blankMap[i];
      const b = blanks[bi];
      const showAns = listeningState.dictationState.showAnswers;
      const cls = b.checked ? (b.correct ? 'dict-blank correct' : 'dict-blank wrong') : 'dict-blank';
      html += `<span class="${cls}">
        <input type="text" class="dict-input" data-blank-idx="${bi}" value="${escapeHTML(b.userInput)}" placeholder="${escapeHTML(b.hint)}" oninput="updateDictationInput(${bi}, this.value)">
        ${(showAns || b.checked) ? `<span class="dict-answer">${escapeHTML(b.answer)}</span>` : ''}
      </span> `;
    } else {
      html += `<span class="dict-word">${escapeHTML(w)}</span> `;
    }
  });
  html += `</div>
    <div class="mt-12 flex-row gap-sm">
      <button class="btn btn-primary btn-sm" onclick="checkDictation()">✓ 检查答案</button>
      <button class="btn btn-outline btn-sm" onclick="resetDictation()">🔄 重新挖空</button>
    </div>
    <div id="dictationResult" class="mt-12"></div>
  </div>`;
  return html;
}

function changeBlankRate(rate) {
  listeningState.dictationState.blankRate = rate;
  listeningState.dictationState.blanks = [];
  listeningState.dictationState.showAnswers = false;
  switchPage('english','english-listening');
}

function updateDictationInput(bi, val) {
  if (listeningState.dictationState.blanks[bi]) {
    listeningState.dictationState.blanks[bi].userInput = val;
  }
}

function checkDictation() {
  const blanks = listeningState.dictationState.blanks;
  let correct = 0;
  blanks.forEach(b => {
    b.checked = true;
    b.correct = b.userInput.trim().toLowerCase() === b.answer.toLowerCase();
    if (b.correct) correct++;
  });
  switchPage('english','english-listening');
  setTimeout(() => {
    const result = document.getElementById('dictationResult');
    if (result) {
      result.innerHTML = `<div class="card" style="background:var(--green-lighter)">
        <div class="text-lg font-bold">听写结果：${correct} / ${blanks.length} 正确</div>
        <div class="text-sm text-gray mt-8">正确率：${Math.round(correct/blanks.length*100)}%</div>
      </div>`;
    }
  }, 50);
  showToast(`听写完成：${correct}/${blanks.length} 正确`);
}

function resetDictation() {
  listeningState.dictationState.blanks = [];
  listeningState.dictationState.showAnswers = false;
  switchPage('english','english-listening');
}

function toggleIntensiveAnswers() {
  listeningState.dictationState.showAnswers = !listeningState.dictationState.showAnswers;
  switchPage('english','english-listening');
}

/* 听力摘要判断 */
function renderIntensiveSummary() {
  const tasks = LISTENING_TASKS.filter(t => t.level === listeningState.level);
  const task = tasks[listeningState.summaryState.taskIdx];
  if (!task || !task.summaries || task.summaries.length === 0) {
    return '<div class="card"><div class="empty-state"><span class="emoji">📋</span>暂无摘要判断题</div></div>';
  }
  if (listeningState.summaryState.summaries.length === 0) {
    listeningState.summaryState.summaries = task.summaries.map(s => ({
      text: s.text, isCorrect: s.correct, answered: false, userAnswer: null
    }));
    listeningState.summaryState.idx = 0;
  }
  const ss = listeningState.summaryState;
  if (ss.idx >= ss.summaries.length) {
    const correct = ss.summaries.filter(s => s.answered && s.userAnswer === s.isCorrect).length;
    return `<div class="quiz-area text-center">
      <div style="font-size:48px">🎉</div>
      <div class="text-xl font-bold mt-12">摘要判断完成！</div>
      <div class="text-lg mt-8">正确：${correct} / ${ss.summaries.length}</div>
      <button class="btn btn-primary mt-16" onclick="listeningState.summaryState.summaries=[];listeningState.summaryState.idx=0;switchPage('english','english-listening')">再来一轮</button>
    </div>`;
  }
  const current = ss.summaries[ss.idx];
  let html = `<div class="quiz-area">
    <div class="flex-between mb-12">
      <span class="text-sm text-gray">${escapeHTML(task.title)} · 第 ${ss.idx+1}/${ss.summaries.length} 题</span>
    </div>
    <div class="flex-row gap-sm mb-12">
      <button class="btn btn-primary btn-sm" onclick="speakIntensiveText()">🔊 播放音频</button>
    </div>
    <div class="quiz-question">判断以下摘要是否正确：</div>
    <div class="summary-text mb-12">${escapeHTML(current.text)}</div>
    <div class="quiz-options" id="quizOptions">`;
  if (!current.answered) {
    html += `<div class="quiz-opt" data-game="summary" data-answer="true">✅ 正确</div>`;
    html += `<div class="quiz-opt" data-game="summary" data-answer="false">❌ 错误</div>`;
  } else {
    const userSaidTrue = current.userAnswer === true;
    html += `<div class="quiz-opt ${current.isCorrect?'correct':(userSaidTrue?'wrong':'')}">✅ 正确</div>`;
    html += `<div class="quiz-opt ${!current.isCorrect?'correct':(!userSaidTrue?'wrong':'')}">❌ 错误</div>`;
    html += `<div class="text-sm text-gray mt-12">正确答案：${current.isCorrect?'正确':'错误'}</div>`;
    html += `<button class="btn btn-primary btn-sm mt-12" onclick="listeningState.summaryState.idx++;switchPage('english','english-listening')">下一题 →</button>`;
  }
  html += '</div></div>';
  return html;
}

function answerSummary(userAnswer) {
  const ss = listeningState.summaryState;
  const current = ss.summaries[ss.idx];
  if (!current || current.answered) return;
  current.answered = true;
  current.userAnswer = userAnswer;
  if (userAnswer !== current.isCorrect) {
    DB.englishData.errorBook.push({
      type:'听力',
      content: '摘要判断: ' + current.text,
      date: today(),
      analysis: '正确答案：' + (current.isCorrect ? '正确' : '错误')
    });
    saveDB();
    showToast('❌ 判断错误，已加入错题本');
  } else {
    showToast('✅ 判断正确！');
  }
  switchPage('english','english-listening');
}
